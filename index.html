  background-clip: unset !important;
}

/* ── Calls valeur — glow couleur entrepreneur ── */
.dash-ent-call {
  text-shadow: 0 0 8px var(--c) !important;
}
.tcval {
  color: var(--c) !important;
  -webkit-text-fill-color: var(--c) !important;
  text-shadow: 0 0 8px var(--c), 0 0 18px rgba(var(--cr),0.4) !important;
}

/* ── Ring KPI — % métallisé ── */
.ring-pct {
  font-family: 'Orbitron', monospace !important;
  background: linear-gradient(170deg, #c8ddf0 0%, #ffffff 40%, #a8c4de 70%, #7a9ec0 100%) !important;
  -webkit-background-clip: text !important;
  -webkit-text-fill-color: transparent !important;
  background-clip: text !important;
  text-shadow: none !important;
  filter: drop-shadow(0 0 2px rgba(0,212,255,0.35)) drop-shadow(0 0 3px rgba(139,92,246,0.25)) drop-shadow(0 0 2px rgba(236,72,153,0.18)) !important;
}
.kpi-tasks-card {
  box-shadow:
    0 0 28px rgba(0,212,255,0.2),
    0 0 65px rgba(0,212,255,0.07),
    inset 0 1px 0 rgba(0,212,255,0.12) !important;
}


/* ── lsum-val (revenus leads) — grand cyan lumineux ── */
.lsum-val {
  font-family: 'Orbitron', monospace !important;
  font-size: 1.55rem !important;
  font-weight: 700 !important;
  color: #00f2ff !important;
  -webkit-text-fill-color: #00f2ff !important;
  text-shadow: 0 0 14px rgba(0,242,255,0.7), 0 0 32px rgba(0,242,255,0.3) !important;
  filter: none !important;
  background: none !important;
  -webkit-background-clip: unset !important;
  background-clip: unset !important;
}
.lsum-name {
  color: rgba(0,212,255,0.7) !important;
  -webkit-text-fill-color: rgba(0,212,255,0.7) !important;
  text-shadow: none !important;
}
.lsum-card {
  background: linear-gradient(145deg,
    rgba(var(--cr, 0,212,255),0.06) 0%,
    rgba(4,10,20,0.97) 55%
  ) !important;
  border: 1px solid rgba(var(--cr, 0,212,255),0.38) !important;
  border-radius: 10px !important;
  box-shadow:
    0 0 22px rgba(var(--cr, 0,212,255),0.2),
    0 0 55px rgba(var(--cr, 0,212,255),0.07) !important;
}

/* ── Funnel bars — plus vivantes ── */
.funnel-row-pct {
  color: #00f2ff !important;
  text-shadow: 0 0 8px rgba(0,242,255,0.6) !important;
}
.funnel-row-lbl {
  color: rgba(220,235,245,0.85) !important;
  text-shadow: none !important;
}

/* ── Tab bar — fond noir translucide ── */
.tabs {
  background: rgba(4,7,18,0.92) !important;
  border-bottom: 1px solid rgba(0,212,255,0.18) !important;
  box-shadow: 0 2px 20px rgba(0,0,0,0.6), 0 0 30px rgba(0,212,255,0.06) !important;
}
.tab.active .ticon {
  filter: drop-shadow(0 0 7px rgba(0,212,255,0.95)) drop-shadow(0 0 20px rgba(0,212,255,0.5)) !important;
}
.tab.active .tlbl {
  color: #00d4ff !important;
  text-shadow: 0 0 8px rgba(0,212,255,0.7) !important;
}
.tab::after {
  background: linear-gradient(90deg, transparent, #00d4ff, transparent) !important;
  box-shadow: none !important;
}

/* ── Live dot — pulse glow ── */
@keyframes livePulse{0%,100%{box-shadow:0 0 5px #00e676,0 0 12px rgba(0,230,118,0.4);}50%{box-shadow:0 0 10px #00e676,0 0 24px rgba(0,230,118,0.7),0 0 40px rgba(0,230,118,0.2);}}
.live-dot {
  animation: livePulse 2s ease-in-out infinite !important;
}

/* ── Auth screen ── */
.auth-card {
  background: rgba(5,10,22,0.9) !important;
  border: 1px solid rgba(0,212,255,0.28) !important;
  border-radius: 18px !important;
  box-shadow: 0 0 60px rgba(0,212,255,0.14), 0 20px 60px rgba(0,0,0,0.7) !important;
}
.auth-logo .t {
  color: #00f2ff !important;
  text-shadow: 0 0 18px rgba(0,242,255,0.7) !important;
}

/* ── Coins dorés — plus lumineux ── */
.gold-corner::before,
.gold-corner::after {
  opacity: 1 !important;
  filter: drop-shadow(0 0 4px rgba(200,160,80,0.7)) !important;
}
/* ── Graph card : supprime coins, ajoute séparateur sous titre ── */
.graph-card.gold-corner::before,
.graph-card.gold-corner::after { display: none !important; }
.graph-head::after {
  content:'';display:block;height:1px;margin-top:8px;
  background:linear-gradient(90deg,transparent 0%,rgba(0,150,255,0.2) 15%,rgba(100,200,255,0.5) 50%,rgba(0,150,255,0.2) 85%,transparent 100%);
  box-shadow:0 0 4px rgba(0,180,255,0.15);
}

/* ── Boutons +/- glow ── */
.mplus::before,
.mplus::after {
  box-shadow: 0 0 8px var(--c, #00d4ff), 0 0 18px rgba(0,212,255,0.35) !important;
}

/* ── dash-title ── */
.dash-title .t {
  color: #00f2ff !important;
  text-shadow: 0 0 16px rgba(0,242,255,0.65) !important;
}
.dash-title .s {
  background: linear-gradient(180deg, #e0f4ff, #8aafc8, #4a7090) !important;
  -webkit-background-clip: text !important;
  background-clip: text !important;
  -webkit-text-fill-color: transparent !important;
  text-shadow: none !important;
}

/* ── Conversion percentage entrepreneur ── */
.dash-ent-conv {
  color: rgba(var(--cr),0.9) !important;
  text-shadow: 0 0 6px rgba(var(--cr),0.6) !important;
}

/* ── Dash ent bar fill — glow ── */
.dash-ent-bar-fill {
  box-shadow: 0 0 8px var(--c, #00d4ff) !important;
}

/* ── KPI sub (sous-labels) ── */
.kpi-sub {
  color: rgba(160,185,210,0.7) !important;
  text-shadow: none !important;
}

/* ── Funnel filter buttons ── */
.funnel-filter-btn {
  background: rgba(0,212,255,0.04) !important;
  border: 1px solid rgba(0,212,255,0.22) !important;
  color: rgba(0,212,255,0.55) !important;
  border-radius: 5px !important;
  box-shadow: none !important;
}
.funnel-filter-btn.active {
  background: rgba(0,212,255,0.12) !important;
  border-color: rgba(0,212,255,0.55) !important;
  color: #00d4ff !important;
  box-shadow: 0 0 10px rgba(0,212,255,0.25) !important;
}
.funnel-filter-btn:hover {
  border-color: rgba(0,212,255,0.45) !important;
  color: rgba(0,212,255,0.85) !important;
}

/* ── Cal cells ── */
.cal-cell.today {
  background: rgba(0,212,255,0.12) !important;
  border-color: rgba(0,212,255,0.5) !important;
  box-shadow: 0 0 10px rgba(0,212,255,0.2) !important;
}
.cal-cell.selected {
  background: rgba(0,212,255,0.08) !important;
  box-shadow: 0 0 8px rgba(0,212,255,0.18) !important;
}

/* ── 3D dashboard perspective renforcée ── */
@media(min-width:769px) {
  .dash-page {
    perspective: 1400px !important;
    perspective-origin: 50% 20% !important;
  }
  .kpi-row, .mid-row, .ents-row, .bottom-row {
    transform: rotateX(0.6deg) !important;
    transform-origin: 50% 0 !important;
  }
}

.ents-row {
  flex-wrap: nowrap !important;
  gap: 10px !important;
  justify-content: stretch !important;
  align-items: flex-start !important;
}

@media(max-width:768px) {
  /* Carrousel swipable : une carte à la fois, aperçu de la suivante */
  .ents-row {
    flex-wrap: nowrap !important;
    overflow-x: auto !important;
    scroll-snap-type: x mandatory !important;
    gap: 10px !important;
    padding-bottom: 6px !important;
    -webkit-overflow-scrolling: touch;
  }
  .ent-hex-card {
    flex: 0 0 82% !important;
    scroll-snap-align: center !important;
  }
}

/* ════════════════════════════════════════════════════════
   FUNNEL 3D TRAPÈZE — Photo Banana style
   ════════════════════════════════════════════════════════ */
.funnel-3d {
  display: flex !important;
  flex-direction: column !important;
  gap: 2px !important;
  padding: 2px 0 !important;
  margin-top: 2px !important;
}

.fstat-step { display: flex !important; flex-direction: column !important; gap: 5px !important; }

.fstat-header {
  display: flex !important;
  align-items: baseline !important;
  gap: 7px !important;
}

.fstat-num {
  font-family: 'Orbitron', monospace !important;
  font-size: 0.44rem !important;
  font-weight: 700 !important;
  min-width: 14px !important;
  flex-shrink: 0 !important;
  opacity: 0.85 !important;
}

.fstat-lbl {
  font-family: 'Space Mono', monospace !important;
  font-size: 0.46rem !important;
  color: rgba(200,220,240,0.72) !important;
  flex: 1 !important;
  white-space: nowrap !important;
  letter-spacing: 0.3px !important;
}

.fstat-pct {
  font-family: 'Orbitron', monospace !important;
  font-size: clamp(0.75rem, 1.5vw, 1.0rem) !important;
  font-weight: 700 !important;
  line-height: 1 !important;
  flex-shrink: 0 !important;
}

.fstat-track {
  height: 2px !important;
  background: rgba(255,255,255,0.10) !important;
  border-radius: 2px !important;
  overflow: visible !important;
  position: relative !important;
}

.fstat-fill {
  height: 100% !important;
  border-radius: 2px !important;
  position: relative !important;
  transition: width 0.8s cubic-bezier(0.4,0,0.2,1) !important;
}

.fstat-connector {
  text-align: center !important;
  font-size: 0.5rem !important;
  color: rgba(255,255,255,0.12) !important;
  line-height: 1 !important;
  letter-spacing: 1px !important;
  padding: 1px 0 !important;
}

.funnel-ents-grid {
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  gap: 3px 10px !important;
  margin-top: 8px !important;
  padding-top: 6px !important;
  border-top: 1px solid rgba(255,255,255,0.06) !important;
}

.funnel-ent-item {
  display: flex !important;
  justify-content: space-between !important;
  align-items: center !important;
  font-size: 0.5rem !important;
  font-family: 'Space Mono', monospace !important;
}

/* ╔══════════════════════════════════════════════════════════════╗
   ║  SOLO LEVELING × SAAS PREMIUM — Design System Final         ║
   ║  bg #020617 · surfaces rgba(15,23,42,.75) · blur(16px)      ║
   ║  border rgba(59,130,246,.25) · radius 6px · Inter/Orbitron  ║
   ╚══════════════════════════════════════════════════════════════╝ */

/* ── Tokens ── */
:root {
  --sl-bg:        #020617;
  --sl-surface:   rgba(15,23,42,0.75);
  --sl-border:    rgba(59,130,246,0.25);
  --sl-border-h:  rgba(59,130,246,0.5);
  --sl-blue:      #3b82f6;
  --sl-blue-dim:  rgba(59,130,246,0.12);
  --sl-text:      #e2e8f0;
  --sl-muted:     rgba(148,163,184,0.6);
  --sl-r:         6px;
}

/* ── Body ── */
body {
  background: #020617 !important;
  background-image: none !important;
  background-attachment: unset !important;
}
/* Grille de fond très subtile */
body::before {
  content: '' !important;
  position: fixed !important;
  inset: 0 !important;
  background-image:
    linear-gradient(rgba(59,130,246,0.025) 1px, transparent 1px),
    linear-gradient(90deg,rgba(59,130,246,0.025) 1px,transparent 1px) !important;
  background-size: 48px 48px !important;
  pointer-events: none !important;
  z-index: 0 !important;
}

/* ── Toutes les cartes ── */
.kpi-card,.kpi-ring-card,.graph-card,.funnel-card,
.dash-ent-card,.rev-card-dash,.acc-header,.obj-card-dash,
.lsum-card,.tasks-wrap,.kpi-tasks-card,.ent-card {
  background: rgba(15,23,42,0.75) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  border: 1px solid rgba(59,130,246,0.22) !important;
  border-radius: var(--sl-r) !important;
  box-shadow: 0 4px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04) !important;
  clip-path: none !important;
}
.kpi-card:hover,.graph-card:hover,.funnel-card:hover,
.rev-card-dash:hover,.ent-card:hover {
  border-color: rgba(59,130,246,0.42) !important;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5),0 0 0 1px rgba(59,130,246,0.14),0 0 24px rgba(59,130,246,0.06) !important;
  transition: border-color .25s,box-shadow .25s !important;
}

/* ── Supprime les coins dorés ── */
.gold-corner::before,.gold-corner::after { display: none !important; }
.gold-corner .gc-bl,.gold-corner .gc-br   { display: none !important; }

/* ── Barre d'onglets ── */
.tabs {
  background: #000000 !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  border-bottom: 1px solid rgba(255,255,255,0.06) !important;
  box-shadow: none !important;
}
.tab { border-bottom: 2px solid transparent !important; transition: border-color .2s !important; }
.tab.active { border-bottom-color: #00d4ff !important; }
.tab.active .tlbl {
  color: #00d4ff !important;
  text-shadow: 0 0 10px rgba(0,212,255,0.55) !important;
}
.tab.active .ticon {
  filter: drop-shadow(0 0 6px rgba(0,212,255,0.9)) drop-shadow(0 0 14px rgba(0,212,255,0.4)) !important;
}
.tab::after { background: linear-gradient(90deg,transparent,rgba(0,212,255,0.65),transparent) !important; }

/* ── Typographie — Orbitron pour les titres, Inter pour les données ── */
.kpi-label,.graph-title,.funnel-title,.rev-title,.stitle,
.obj-title,.kpi-tasks-lbl,.tasks-sub,.tasks-title,
.dash-title .t,.dash-title .s,.ent-card-name,.hname {
  font-family: 'Orbitron',sans-serif !important;
}
.kpi-label {
  font-size: 0.53rem !important; font-weight: 700 !important;
  letter-spacing: 1.8px !important;
  color: rgba(148,163,184,0.58) !important;
  text-shadow: none !important;
}
.dash-title .t {
  font-size: 1.15rem !important; font-weight: 900 !important;
  color: #60a5fa !important;
  text-shadow: 0 0 18px rgba(96,165,250,0.35) !important;
  background: none !important; -webkit-text-fill-color: unset !important;
}
.dash-title .s {
  font-size: 1.15rem !important; font-weight: 400 !important;
  color: rgba(148,163,184,0.45) !important;
  background: none !important; -webkit-text-fill-color: unset !important;
  text-shadow: none !important;
}
.graph-title,.funnel-title,.rev-title,.stitle,.obj-title {
  font-size: 0.57rem !important; font-weight: 700 !important;
  letter-spacing: 2px !important;
  color: rgba(148,163,184,0.6) !important;
  text-shadow: none !important;
}
.kpi-tasks-lbl,.tasks-sub {
  font-size: 0.5rem !important;
  color: rgba(96,165,250,0.4) !important;
  letter-spacing: 2px !important;
}
.tasks-title {
  font-size: 0.85rem !important; font-weight: 700 !important;
  letter-spacing: 2.5px !important;
  color: #e2e8f0 !important;
}

/* Inter pour toutes les valeurs chiffrées */
.kpi-val,.lsum-val,.tcval,.mval-input,
.dash-ent-val,.hval,.hconv,.ent-card-total,
.kpi-sub,.dash-sub,.funnel-ent-item,
.fstep-lbl,.funnel-row-pct,.funnel-row-lbl,
.mlbl,.task-lbl,.task-badge,.tlbl {
  font-family: 'Inter',system-ui,sans-serif !important;
}

/* KPI valeurs */
.kpi-val {
  font-size: clamp(1.5rem,2.8vw,2.1rem) !important;
  font-weight: 700 !important;
  color: #f1f5f9 !important;
  letter-spacing: -0.5px !important;
  text-shadow: none !important;
}
.kpi-sub {
  font-size: 0.6rem !important; font-weight: 400 !important;
  color: rgba(148,163,184,0.48) !important;
}

/* ── Boutons +/− — icônes minimalistes ── */
.mbtn-wrap {
  background: rgba(15,23,42,0.6) !important;
  border: 1px solid rgba(59,130,246,0.18) !important;
  border-radius: var(--sl-r) !important;
  gap: 0 !important; overflow: hidden !important;
}
.mminus,.mplus {
  width: 30px !important; height: 30px !important;
  background: transparent !important;
  border: none !important; border-radius: 0 !important;
  box-shadow: none !important; text-shadow: none !important;
  color: transparent !important; font-size: 0 !important;
  position: relative !important; overflow: visible !important;
  transition: background .15s !important;
  opacity: 1 !important;
}
.mminus { border-right: 1px solid rgba(59,130,246,0.12) !important; }
.mplus  { border-left:  1px solid rgba(59,130,246,0.12) !important; }

/* Barre — du bouton minus (via ::after, cohérent avec le bloc précédent) */
.mminus::after {
  content: '' !important; display: block !important;
  width: 9px !important; height: 1.5px !important;
  background: rgba(148,163,184,0.45) !important;
  border-radius: 1px !important;
  position: absolute !important; top: 50% !important; left: 50% !important;
  transform: translate(-50%,-50%) !important;
  box-shadow: none !important; transition: background .15s !important;
}
/* Neutralise ::before et ::after hérités pour mplus */
.mplus::before,.mplus::after {
  content: '' !important; display: block !important;
  background: rgba(148,163,184,0.45) !important;
  border-radius: 1px !important;
  position: absolute !important; top: 50% !important; left: 50% !important;
  box-shadow: none !important; transition: background .15s !important;
}
.mplus::before { width: 9px !important; height: 1.5px !important; transform: translate(-50%,-50%) !important; }
.mplus::after  { width: 1.5px !important; height: 9px !important; transform: translate(-50%,-50%) !important; }

/* Hover glow bleu discret */
.mminus:hover { background: rgba(59,130,246,0.07) !important; opacity: 1 !important; }
.mminus:hover::after { background: #60a5fa !important; }
.mplus:hover  { background: rgba(59,130,246,0.1)  !important; opacity: 1 !important; }
.mplus:hover::before,.mplus:hover::after { background: #60a5fa !important; }
.mminus:active,.mplus:active { transform: scale(0.9) !important; }

/* Input valeur */
.mval-input {
  color: #e2e8f0 !important; font-size: 13px !important;
  font-weight: 600 !important; width: 38px !important;
  background: transparent !important; border: none !important;
  font-feature-settings: 'tnum' !important;
}
.mval-input.call-val { color: var(--c) !important; }

/* ── Metric rows (Jour tab) ── */
.mrow {
  height: 46px !important;
  border-bottom: 1px solid rgba(59,130,246,0.07) !important;
}
.mrow.sep { border-top: 1px solid rgba(var(--cr,59,130,246),0.14) !important; }
.mlbl { font-size: 12px !important; font-weight: 400 !important; color: rgba(148,163,184,0.6) !important; }
.mlbl.call { color: var(--c) !important; font-weight: 600 !important; }

/* ── Ent card (Jour) ── */
.ent-card { border-radius: var(--sl-r) !important; }
.ent-card-head {
  background: linear-gradient(180deg,rgba(var(--cr,59,130,246),0.06),transparent) !important;
  border-bottom: 1px solid rgba(var(--cr,59,130,246),0.1) !important;
  padding: 12px 16px 10px !important;
}
.ent-card-name {
  font-size: 0.82rem !important; font-weight: 700 !important;
  letter-spacing: 2.5px !important;
}
.ent-card-total {
  font-size: 10px !important; font-weight: 600 !important;
  border-radius: 4px !important;
  border: 1px solid rgba(var(--cr,59,130,246),0.18) !important;
  background: rgba(var(--cr,59,130,246),0.06) !important;
}
.tcrow { border-top: 1px solid rgba(var(--cr,59,130,246),0.1) !important; }
.tclbl { color: #60a5fa !important; font-size: 11px !important; font-weight: 500 !important; letter-spacing: .5px !important; text-transform: uppercase !important; }
.tcval { color: #60a5fa !important; font-size: 1rem !important; font-weight: 700 !important; }

/* ── Daily Tasks ── */
.kpi-tasks-card::before,.kpi-tasks-card::after,
.tasks-wrap::before,.tasks-wrap::after { display: none !important; }
.kpi-tasks-bg,.tasks-bg-grid { display: none !important; }

.task-item {
  background: rgba(15,23,42,0.5) !important;
  border: 1px solid rgba(59,130,246,0.1) !important;
  border-radius: var(--sl-r) !important;
}
.task-item:hover { border-color: rgba(59,130,246,0.26) !important; }
.task-item.done {
  background: rgba(15,23,42,0.2) !important;
  border-color: rgba(59,130,246,0.05) !important;
}
.task-cb {
  border: 1px solid rgba(59,130,246,0.28) !important;
  border-radius: 3px !important; background: transparent !important;
}
.task-cb.checked {
  background: #3b82f6 !important; border-color: #3b82f6 !important;
  box-shadow: 0 0 8px rgba(59,130,246,0.5) !important;
}
.task-lbl { font-size: 12px !important; font-weight: 400 !important; color: rgba(226,232,240,0.82) !important; }
.task-item.done .task-lbl { color: rgba(148,163,184,0.28) !important; text-decoration-color: rgba(59,130,246,0.18) !important; }
.task-badge { font-size: 9px !important; border-radius: 3px !important; font-weight: 500 !important; }

/* ── Funnel filters ── */
.funnel-filter-btn {
  border-radius: 4px !important; font-size: 8.5px !important;
  font-weight: 500 !important; font-family: 'Inter',system-ui,sans-serif !important;
  border: 1px solid rgba(59,130,246,0.18) !important;
  color: rgba(148,163,184,0.6) !important;
  background: transparent !important;
  padding: 3px 8px !important;
}
.funnel-filter-btn:hover { border-color: rgba(59,130,246,0.42) !important; color: #60a5fa !important; }
.funnel-filter-btn.active {
  background: rgba(59,130,246,0.12) !important;
  border-color: rgba(59,130,246,0.48) !important;
  color: #60a5fa !important;
}

/* ── Live dot ── */
.live-dot { background: #00e676 !important; }
.live-lbl { color: rgba(0,230,118,0.75) !important; font-family: 'Inter',system-ui,sans-serif !important; font-size: 7.5px !important; }


/* ── Scrollbar épurée ── */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.22); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(59,130,246,0.4); }

/* ════════════════════════════════════════════════════════════════
   UI/UX PRO MAX — Rank S Refinements
   Executive Dashboard × Dark OLED × Player Profile
   ════════════════════════════════════════════════════════════════ */

/* ── Hover lift (skill: metric card hover lift 150-300ms) ── */
@media(prefers-reduced-motion:no-preference) {
  .kpi-card,.graph-card,.funnel-card,.rev-card-dash,.ent-card,.ent-hex-card {
    transition: transform .2s cubic-bezier(.4,0,.2,1), border-color .2s, box-shadow .2s !important;
  }
  .kpi-card:hover,.graph-card:hover,.funnel-card:hover { transform: translateY(-2px) !important; }
  .ent-card:hover { transform: translateY(-2px) !important; }
}

/* ── KPI card accent top-edge ── */
.kpi-card {
  border-top: 1px solid rgba(var(--kc, 59,130,246), 0.55) !important;
}


/* ── Barre objectif ── */
.hobj-row {
  width: 100% !important;
  margin-top: 3px !important;
}
.hobj-bar {
  background: rgba(255,255,255,0.04) !important;
}
.hobj-fill {
  height: 100% !important;
  border-radius: 2px !important;
  position: relative !important;
}
/* Glow sur le bord droit de la barre objectif */
.hobj-fill::after {
  content: '' !important;
  position: absolute !important;
  right: 0 !important; top: -1px !important; bottom: -1px !important;
  width: 4px !important;
  background: inherit !important;
  filter: blur(3px) !important;
  border-radius: 2px !important;
}
.hobj-pct {
  font-family: 'Inter', system-ui, sans-serif !important;
  font-size: clamp(0.38rem, 0.72vw, 0.5rem) !important;
  font-weight: 700 !important;
}

/* ── hconv-row : layout mis à jour ── */
.hconv-row { gap: 0 !important; }
.hconv { font-size: clamp(0.42rem, 0.82vw, 0.58rem) !important; font-weight: 700 !important; text-align: right !important; }

/* ── Ent card Jour — Player Profile rank badge ── */
.ent-card-head-inner { gap: 8px !important; }
.ent-card-total {
  font-size: 9px !important;
  letter-spacing: 0.5px !important;
  padding: 3px 8px !important;
}

/* ── Fade-in stagger pour les cartes (CSS-only) ── */
@keyframes sl-card-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media(prefers-reduced-motion:no-preference) {
  .kpi-row > * { animation: sl-card-in .4s cubic-bezier(.4,0,.2,1) both; }
  .kpi-row > *:nth-child(1) { animation-delay: .05s; }
  .kpi-row > *:nth-child(2) { animation-delay: .10s; }
  .kpi-row > *:nth-child(3) { animation-delay: .15s; }
  .kpi-row > *:nth-child(4) { animation-delay: .20s; }
  .kpi-row > *:nth-child(5) { animation-delay: .25s; }
}

/* ── Focus visible (skill: accessibility) ── */
:focus-visible {
  outline: 2px solid rgba(59,130,246,0.7) !important;
  outline-offset: 2px !important;
}

/* ── Respect prefers-reduced-motion ── */
@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

/* ── Curseur pointer sur tous les éléments cliquables ── */
.tab,.task-item,.funnel-filter-btn,.mminus,.mplus,
.ent-hex-card,[onclick] { cursor: pointer !important; }

/* ════════════════════════════════════════════════════════════
   PODIUM — TOP CE MOIS (style asset)
   ════════════════════════════════════════════════════════════ */
.pm-wrap {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: linear-gradient(to top, rgba(0,212,255,0.06) 0%, transparent 12%);
  overflow: hidden;
}
.pm-header {
  display: flex; align-items: center; justify-content: center;
  padding: 7px 0 4px;
  border-bottom: 1px solid rgba(0,212,255,0.1);
}
.pm-title-txt {
  font-family: 'Orbitron', monospace;
  font-size: 7px; font-weight: 700;
  letter-spacing: 4px; color: rgba(0,212,255,0.7);
  text-transform: uppercase;
}
.pm-stage {
  flex: 1; display: flex; align-items: flex-end;
  justify-content: center; gap: 0; padding: 4px 2px 5px;
  position: relative;
}
.pm-stage::before {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 100%;
  background:
    radial-gradient(ellipse 28% 75% at 16% 88%, rgba(110,40,255,0.36) 0%, transparent 65%),
    radial-gradient(ellipse 28% 75% at 84% 88%, rgba(110,40,255,0.36) 0%, transparent 65%),
    radial-gradient(ellipse 62% 52% at 50% 96%, rgba(85,30,220,0.26) 0%, transparent 68%),
    radial-gradient(ellipse 88% 28% at 50% 100%, rgba(0,200,255,0.30) 0%, transparent 80%);
  pointer-events: none;
  z-index: 0;
}
.pm-wing { position: absolute; bottom: 4px; opacity: 0.7; }
.pm-wing-l { left: 0; }
.pm-wing-r { right: 0; }
.pm-slots {
  display: flex; align-items: flex-end;
  gap: 3px; justify-content: center; z-index: 1;
}
.pm-slot {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px;
  border-radius: 4px; padding: 5px 6px;
  background: rgba(8,8,10,0.92);
  position: relative;
}
.pm-p1 {
  width: 80px; height: 95px;
  border: 1px solid rgba(255,225,80,0.9);
  box-shadow:
    0 0 10px rgba(255,215,0,0.22),
    inset 0 1px 0 rgba(255,255,255,0.14),
    inset 0 0 18px rgba(255,215,0,0.06);
  z-index: 1;
}
.pm-p2 {
  width: 62px; height: 75px;
  border: 1px solid rgba(210,210,210,0.9);
  box-shadow:
    0 0 8px rgba(192,192,192,0.20),
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 0 14px rgba(192,192,192,0.05);
  z-index: 1;
}
.pm-p3 {
  width: 62px; height: 62px;
  border: 1px solid rgba(215,140,60,0.9);
  box-shadow:
    0 0 8px rgba(205,127,50,0.20),
    inset 0 1px 0 rgba(255,255,255,0.10),
    inset 0 0 14px rgba(205,127,50,0.05);
  z-index: 1;
}
.pm-p1::before, .pm-p2::before, .pm-p3::before {
  content:''; position:absolute; top:0; left:8%; right:8%; height:1px; border-radius:1px; z-index:1;
}
.pm-p1::before { background:linear-gradient(90deg, transparent, rgba(255,220,80,0.9) 50%, transparent); }
.pm-p2::before { background:linear-gradient(90deg, transparent, rgba(220,220,220,0.8) 50%, transparent); }
.pm-p3::before { background:linear-gradient(90deg, transparent, rgba(215,145,65,0.85) 50%, transparent); }
@keyframes crown-breathe {
  0%,100% { filter: drop-shadow(0 0 5px rgba(255,215,0,0.30)); }
  50%      { filter: drop-shadow(0 0 9px rgba(255,215,0,0.62)); }
}
.pm-crown {
  position: absolute; left: 50%; transform: translateX(-50%);
}
.pm-p1 .pm-crown img {
  animation: crown-breathe 3.2s ease-in-out infinite;
}
.pm-p1 .pm-crown { top: -38px; }
.pm-p2 .pm-crown { top: -32px; }
.pm-p3 .pm-crown { top: -28px; }
.pm-badge {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  width: 16px; height: 16px; border-radius: 50%; border: 1px solid;
  background: rgba(3,8,22,0.95);
  font-family: 'Orbitron', monospace; font-size: 7px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.pm-name {
  font-family: 'Orbitron', monospace;
  font-size: 7px; font-weight: 700; letter-spacing: 1px;
  text-align: center; text-transform: uppercase;
  text-shadow: 0 0 8px currentColor;
}
.pm-val {
  font-family: 'Orbitron', monospace;
  font-size: 13px; font-weight: 900; color: #fff;
  text-shadow: 0 0 8px rgba(255,255,255,0.3);
  text-align: center; letter-spacing: 0.5px;
  margin-top: 1px;
}
.pm-p2 .pm-val, .pm-p3 .pm-val { font-size: 10px; }
.pm-sub {
  font-size: 6px; color: rgba(255,215,0,0.4);
  font-family: 'Space Mono', monospace; letter-spacing: 1px;
  text-align: center; margin-top: 1px;
}
.pm-empty { opacity: 0.3; }

// Calcule la rotation hue nécessaire pour teinter hex-cluster.jpg (cyan ~200°) vers la couleur cible
function hex2hueRot(h){
  const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
  const M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;
  if(!d)return 0;
  let hue=M===r?(g-b)/d+(g<b?6:0):M===g?(b-r)/d+2:(r-g)/d+4;
  hue=Math.round(hue*60);
  return hue-200; // décalage depuis le cyan ~200° de card-frame.jpg
}

// Realtime listeners
const _listeners={};

async function loadMonth(y,mo){
  const k=y+'_'+mo;
  if(_listeners[k])return mCache[k]||{};
  return new Promise(resolve=>{
    let resolved=false;
    const unsub=onValue(ref(db,'v2/'+y+'/'+mo),snap=>{
      mCache[k]=snap.exists()?snap.val():{};
      // Keep localStorage in sync with latest Firebase data
      try{localStorage.setItem('st_metrics_'+k,JSON.stringify(mCache[k]));}catch(e){}
      if(!resolved){
        resolved=true;
        resolve(mCache[k]);
      } else {
        // Update from another device — invalidate and re-render
        delete mCache[k];
        mCache[k]=snap.exists()?snap.val():{};
        if(curTab==='jour') renderJour();
        else if(curTab==='dash') renderDash();
      }
    },()=>{
      // Firebase unreachable — fall back to localStorage cache
      if(!resolved){
        resolved=true;
        try{
          const cached=localStorage.getItem('st_metrics_'+k);
          mCache[k]=cached?JSON.parse(cached):{};
        }catch(e){mCache[k]={};}
        resolve(mCache[k]);
      }
    });
    _listeners[k]=unsub;
  });
}

// Metric order per ent (drag & drop)
let METRIC_ORDER = {};
function getMetricsOrdered(key){
  const base=[...UNIFIED_METRICS];// Always start from full universal list
  let order=METRIC_ORDER[key];
  // Firebase may return {0:'firstmsg',1:'replies'} instead of array
  if(order&&typeof order==='object'&&!Array.isArray(order)){
    order=Object.values(order).filter(v=>typeof v==='string');
  }
  if(!order||!Array.isArray(order)||order.length===0)return base;
  // Reorder base according to saved order
  const ordered=order.map(k=>base.find(m=>m.k===k)).filter(Boolean);
  // Add any new metrics not yet in saved order
  base.forEach(m=>{if(!ordered.find(o=>o.k===m.k))ordered.push(m);});
  return ordered;
}
async function saveMetricOrder(key,order){
  METRIC_ORDER[key]=order;
  try{await set(ref(db,`config/metricOrder/${key}`),order);}catch(e){}
}
async function loadMetricOrders(){
  try{
    const s=await get(ref(db,'config/metricOrder'));
    if(s.exists()){
      const data=s.val()||{};
      // Firebase stores arrays as objects {0:'a',1:'b'} - convert back to arrays
      Object.keys(data).forEach(ek=>{
        const val=data[ek];
        if(val&&typeof val==='object'&&!Array.isArray(val)){
          METRIC_ORDER[ek]=Object.values(val);
        } else if(Array.isArray(val)){
          METRIC_ORDER[ek]=val;
        }
      });
    }
  }catch(e){}
}

function drawRingFrame(canvasId, progress, size){
  const c=document.getElementById(canvasId);if(!c)return false;
  const dpr=window.devicePixelRatio||2;
  c.width=size*dpr;c.height=size*dpr;
  c.style.width=size+'px';c.style.height=size+'px';
  const ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  const cx=size/2,cy=size/2,r=size*0.34,lw=size*0.115;
  ctx.clearRect(0,0,size,size);

  // Subtle inner glow (low opacity to not wash out text)
  const innerR=r-lw/2-1;
  const ig=ctx.createRadialGradient(cx,cy,2,cx,cy,innerR);
  ig.addColorStop(0,'rgba(60,20,140,0.10)');ig.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(cx,cy,innerR,0,Math.PI*2);ctx.fillStyle=ig;ctx.fill();

  // Metallic track — conic gradient simulates light from top
  // startAngle=0.8π → bright specular lands at 12 o'clock (stop 0.35)
  const mg=ctx.createConicGradient(Math.PI*0.80,cx,cy);
  mg.addColorStop(0,    '#0a1520');
  mg.addColorStop(0.20, '#1e3254');
  mg.addColorStop(0.28, '#4d7098');
  mg.addColorStop(0.35, '#9ec4e0');  // specular highlight — 12 o'clock
  mg.addColorStop(0.42, '#4a6e94');
  mg.addColorStop(0.55, '#1a2c48');
  mg.addColorStop(0.72, '#0a1520');
  mg.addColorStop(0.86, '#141e30');
  mg.addColorStop(1,    '#0a1520');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle=mg;ctx.lineWidth=lw;ctx.stroke();

  // Bevels: dark outer edge + faint inner edge
  ctx.beginPath();ctx.arc(cx,cy,r+lw/2-0.6,0,Math.PI*2);
  ctx.strokeStyle='rgba(0,0,0,0.75)';ctx.lineWidth=1.2;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,r-lw/2+0.6,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=0.8;ctx.stroke();

  // Tick marks
  const nTicks=36,outerEdge=r+lw/2-2;
  for(let i=0;i<nTicks;i++){
    const a=(i/nTicks)*Math.PI*2,isMain=i%9===0;
    const tLen=isMain?lw*0.50:lw*0.26;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*outerEdge,cy+Math.sin(a)*outerEdge);
    ctx.lineTo(cx+Math.cos(a)*(outerEdge-tLen),cy+Math.sin(a)*(outerEdge-tLen));
    ctx.strokeStyle=isMain?'rgba(160,210,255,0.45)':'rgba(100,145,200,0.18)';
    ctx.lineWidth=isMain?1.0:0.6;ctx.stroke();
  }

  // Progress arc — tighter, less blur
  if(progress>0.005){
    const sa=-Math.PI/2,ea=sa+Math.min(progress,1)*Math.PI*2;
    const ag=ctx.createLinearGradient(cx,cy-r,cx,cy+r);
    ag.addColorStop(0,'#00d4ff');ag.addColorStop(0.48,'#818cf8');ag.addColorStop(1,'#ec4899');
    ctx.save();ctx.shadowColor='#6d28d9';ctx.shadowBlur=4;
    ctx.beginPath();ctx.arc(cx,cy,r,sa,ea);
    ctx.strokeStyle=ag;ctx.lineWidth=lw*0.68;ctx.lineCap='round';ctx.stroke();
    ctx.restore();
    // Thin bright inner stripe
    ctx.beginPath();ctx.arc(cx,cy,r-lw*0.28,sa,ea);
    ctx.strokeStyle='rgba(200,240,255,0.18)';ctx.lineWidth=lw*0.16;ctx.lineCap='round';ctx.stroke();
    // Tip dot
    ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=5;
    ctx.beginPath();ctx.arc(cx+Math.cos(ea)*r,cy+Math.sin(ea)*r,size*0.038,0,Math.PI*2);
    ctx.fillStyle='#fff';ctx.fill();ctx.restore();
  }

  // Orbits
  orbits.forEach(o=>{
    o.off+=o.speed;
    const or=o.r*size;
    ctx.save();ctx.globalAlpha=o.op;
    ctx.beginPath();ctx.arc(cx,cy,or,o.off,o.off+o.len*Math.PI*2);
    ctx.strokeStyle=o.color;ctx.lineWidth=o.w;ctx.stroke();
    const px=cx+Math.cos(o.off+o.len*Math.PI*2)*or;
    const py=cy+Math.sin(o.off+o.len*Math.PI*2)*or;
    ctx.beginPath();ctx.arc(px,py,1.8,0,Math.PI*2);ctx.fillStyle=o.color;ctx.fill();
    ctx.restore();
  });
  return true;
}

function switchTab(tab,el){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  if(_uRaf){cancelAnimationFrame(_uRaf);_uRaf=null;}
  if(tab!=='dash'){
    if(window._podiumSparkleRAF){cancelAnimationFrame(window._podiumSparkleRAF);window._podiumSparkleRAF=null;}
    if(window._activityParticleRAF){cancelAnimationFrame(window._activityParticleRAF);window._activityParticleRAF=null;}
  }
  curTab=tab;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.remove('active');
    setTabIconActive(t.dataset.tab,false);
  });
  el.classList.add('active');
  setTabIconActive(tab,true);
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page_'+tab).classList.add('active');
  render();
}
window.switchTab=switchTab;

function changeMonth(dir){
  // Unsubscribe old month listener to save bandwidth
  const oldK=`${cY}_${cM}`;
  if(_listeners[oldK]){_listeners[oldK]();delete _listeners[oldK];delete mCache[oldK];}
  cM+=dir;if(cM>11){cM=0;cY++;}if(cM<0){cM=11;cY--;}selDay=1;render();
}
window.changeMonth=changeMonth;
function selectDay(d){selDay=d;renderJour();}
window.selectDay=selectDay;

async function render(){
  if(curTab==='dash')await renderDash();
  else if(curTab==='jour')await renderJour();
  else if(curTab==='leads')await renderLeads();
  else renderParams();
}

// ===== HEX DASHBOARD =====
let _hexFrame=0;
let _hexMetalPat=null;
function drawHexDash(entData){
  window._lastEntData=entData;
  _hexFrame++;
  const canvas=document.getElementById('hexDash');if(!canvas)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||300,H=150;
  if(canvas.width!==W*dpr||canvas.height!==H*dpr){canvas.width=W*dpr;canvas.height=H*dpr;}
  const ctx=canvas.getContext('2d');ctx.save();ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  if(!_hexMetalPat){const pc=document.createElement('canvas');pc.width=4;pc.height=4;const pctx=pc.getContext('2d');pctx.fillStyle='#2a2a2a';pctx.fillRect(0,0,4,4);pctx.strokeStyle='#353535';pctx.lineWidth=0.5;pctx.beginPath();pctx.moveTo(0,0);pctx.lineTo(4,4);pctx.stroke();pctx.beginPath();pctx.moveTo(2,0);pctx.lineTo(4,2);pctx.stroke();pctx.beginPath();pctx.moveTo(0,2);pctx.lineTo(2,4);pctx.stroke();_hexMetalPat=ctx.createPattern(pc,'repeat');}
  const r=Math.min(W/6,H*0.38)*1.15;
  const cy=H*0.52;
  const positions=[{x:W/8,y:cy},{x:W*3/8,y:cy},{x:W*5/8,y:cy},{x:W*7/8,y:cy}];

  function hexVerts(cx,cy,rad){const v=[];for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;v.push({x:cx+Math.cos(a)*rad,y:cy+Math.sin(a)*rad});}return v;}
  function hexPath(cx,cy,rad){const v=hexVerts(cx,cy,rad);ctx.beginPath();ctx.moveTo(v[0].x,v[0].y);for(let i=1;i<6;i++)ctx.lineTo(v[i].x,v[i].y);ctx.closePath();}

  entData.forEach((d,i)=>{
    const p=positions[i];
    const col=d.e.hex;
    // Couches (fraction du rayon)
    const RO=r;        // bord extérieur biseau
    const RI=r*0.63;   // bord intérieur biseau / bord ext rainure
    const RF=r*0.565;  // centre anneau fibre optique
    const RS=r*0.52;   // bord intérieur écran

    // ── 1. FACES TRAPÉZOÏDALES DU BISEAU MÉTALLIQUE ──
    // Face i : outerV[i]→outerV[i+1] + innerV[i+1]→innerV[i]
    // Lumière haut-gauche : face 3 (normale 240°) = plus lumineuse, face 1 (120°) = plus sombre
    const outerV=hexVerts(p.x,p.y,RO);
    const innerV=hexVerts(p.x,p.y,RI);
    const faceC=['#1d1d1d','#141414','#212121','#484848','#565656','#2e2e2e'];
    for(let f=0;f<6;f++){
      const f2=(f+1)%6;
      ctx.beginPath();
      ctx.moveTo(outerV[f].x,outerV[f].y);ctx.lineTo(outerV[f2].x,outerV[f2].y);
      ctx.lineTo(innerV[f2].x,innerV[f2].y);ctx.lineTo(innerV[f].x,innerV[f].y);
      ctx.closePath();
      ctx.fillStyle=faceC[f];ctx.fill();
      ctx.save();ctx.globalAlpha=0.10;ctx.fillStyle=_hexMetalPat;ctx.fill();ctx.restore();
    }
    // Arête lumineuse sur faces 3+4 (haut-gauche/haut)
    [3,4].forEach(f=>{const f2=(f+1)%6;ctx.beginPath();ctx.moveTo(outerV[f].x,outerV[f].y);ctx.lineTo(outerV[f2].x,outerV[f2].y);ctx.strokeStyle='#7a7a7a';ctx.lineWidth=0.7;ctx.stroke();});
    // Arête sombre sur faces 0+1 (bas)
    [0,1].forEach(f=>{const f2=(f+1)%6;ctx.beginPath();ctx.moveTo(outerV[f].x,outerV[f].y);ctx.lineTo(outerV[f2].x,outerV[f2].y);ctx.strokeStyle='#080808';ctx.lineWidth=0.7;ctx.stroke();});

    // ── 2. RAINURE NOIRE PROFONDE ──
    hexPath(p.x,p.y,RI);ctx.fillStyle='#020202';ctx.fill();

    // ── 3. ANNEAU FIBRE OPTIQUE — enchâssé dans la rainure, glow confiné ──
    ctx.save();
    hexPath(p.x,p.y,RI);ctx.clip();
    hexPath(p.x,p.y,RF);
    ctx.shadowColor=col;ctx.shadowBlur=8;
    ctx.strokeStyle=col;ctx.lineWidth=3.5;ctx.stroke();
    ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=0.6;ctx.stroke();
    ctx.restore();

    // ── 4. ÉCRAN INTÉRIEUR SOMBRE ET MAT ──
    hexPath(p.x,p.y,RS);
    ctx.save();ctx.clip();
    hexPath(p.x,p.y,RS);
    const crgb=hex2rgb(col);
    const sg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,RS);
    sg.addColorStop(0,`rgba(${crgb},0.15)`);sg.addColorStop(1,'#080808');
    ctx.fillStyle=sg;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.016)';ctx.lineWidth=0.5;
    for(let ly=p.y-RS;ly<p.y+RS;ly+=1.8){ctx.beginPath();ctx.moveTo(p.x-RS,ly);ctx.lineTo(p.x+RS,ly);ctx.stroke();}
    ctx.restore();

    // ── 5. ARC CONVERSION ──
    const cv=Math.min(d.conv/100,1);
    if(cv>0){
      ctx.save();
      ctx.beginPath();ctx.arc(p.x,p.y,RS*0.78,-Math.PI/2,-Math.PI/2+cv*Math.PI*2);
      ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.lineCap='round';ctx.stroke();
      const ea=-Math.PI/2+cv*Math.PI*2;
      ctx.beginPath();ctx.arc(p.x+Math.cos(ea)*RS*0.78,p.y+Math.sin(ea)*RS*0.78,1.8,0,Math.PI*2);
      ctx.fillStyle='#fff';ctx.fill();
      ctx.restore();
    }

    // ── 6. LABELS ──
    ctx.fillStyle='#cccccc';ctx.font='700 7px monospace';ctx.textAlign='center';ctx.fillText(d.e.name,p.x,p.y-8);
    ctx.fillStyle='#ffffff';ctx.font='800 12px monospace';ctx.fillText(d.conv+'%',p.x,p.y+4);
    ctx.fillStyle='#cccccc';ctx.font='700 6px monospace';ctx.fillText(d.calls+' calls',p.x,p.y+14);
  });
  ctx.restore();
}

  setTimeout(()=>{
    const sc=document.getElementById('podiumSparkle');
    if(!sc)return;
    sc.width=sc.offsetWidth||300;
    sc.height=sc.offsetHeight||170;
    const W=sc.width,H=sc.height;
    const ctx=sc.getContext('2d');
    const pts=[];
    function spawnPt(){
      pts.push({
        x:Math.random()*W*0.85+W*0.075,
        y:Math.random()*H*0.92,
        r:Math.random()*0.6+0.25,
        vx:(Math.random()-0.5)*0.3,
        vy:-(Math.random()*0.45+0.15),
        phase:Math.random()*Math.PI*2,
        life:0,
        maxLife:Math.floor(Math.random()*90+60),
        c:Math.random()>0.55?'0,200,255':'135,65,255'
      });
    }
    function drawFrame(){
      ctx.clearRect(0,0,W,H);
      if(Math.random()<0.09&&pts.length<38)spawnPt();
      for(let i=pts.length-1;i>=0;i--){
        const p=pts[i];p.life++;
        const t=p.life/p.maxLife;
        const a=t<0.18?t/0.18:t<0.72?1:(1-t)/0.28;
        if(a<=0||p.y<-4){pts.splice(i,1);continue;}
        p.x+=p.vx+Math.sin(p.life*0.07+p.phase)*0.18;
        p.y+=p.vy;
        // halo ultra-fin
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3.5);
        g.addColorStop(0,`rgba(${p.c},${(a*0.38).toFixed(2)})`);
        g.addColorStop(1,`rgba(${p.c},0)`);
        ctx.fillStyle=g;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.5,0,Math.PI*2);ctx.fill();
        // point central
        ctx.save();ctx.globalAlpha=a*0.85;
        ctx.fillStyle=`rgba(${p.c},1)`;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
        ctx.restore();
        if(p.life>=p.maxLife)pts.splice(i,1);
      }
      window._podiumSparkleRAF=requestAnimationFrame(drawFrame);
    }
    drawFrame();
  },60);
}

async function renderDash(){
  const div=document.getElementById('page_dash');
  const md=await loadMonth(cY,cM);
  const leads=await loadLeads(cY,cM);
  const revenus=await loadRevenus(cY,cM);
  const obj=await loadObjectifs(cY,cM);
  const rev=await loadRevenus(cY,cM);
  const dim=new Date(cY,cM+1,0).getDate();
  window._dashCache={md,leads,dim};
  const today=now.getDate();

  // Totals
  let todayTotal=0;ENTS.forEach(e=>getMet(e.key).forEach(m=>todayTotal+=gv(md,today,e.key,m.k)));
  let monthCalls=0;for(let d=1;d<=dim;d++)ENTS.forEach(e=>{monthCalls+=getTotalCalls(e.key,md[d]);});

  // Revenus
  let myPart=0;
  ENTS.forEach(e=>{
    const rMan=parseFloat(rev[e.key]?.montant||0);
    // Revenus manuels = directement ce que tu touches (pas de calcul %)
    const rLead=Object.values(leads).filter(l=>l.entKey===e.key).reduce((s,l)=>s+(parseFloat(l.cashReceived)||0)*(e.rate/100),0);
    myPart+=rMan>0?rMan:rLead;
  });

  // Funnel
  const funnelEnts=ENTS.filter(e=>e.key===(window.dashFunnelFilter||'gael'));
  let tfm=0,trep=0,tfu=0,trfu=0,tln=0,tc=0;
  for(let d=1;d<=dim;d++)funnelEnts.forEach(e=>{
    tfm+=gv(md,d,e.key,'firstmsg');trep+=gv(md,d,e.key,'replies');
    tfu+=gv(md,d,e.key,'followup');trfu+=gv(md,d,e.key,'repliesfu');
    tln+=gv(md,d,e.key,'lien');tc+=getTotalCalls(e.key,md[d]);
  });
  const pct=(a,b)=>b>0?Math.round(a/b*100):0;

  // Ventes from leads (with installment deduplication)
  const _installTags=['x2','x3','à compte'];
  const _fLeads=Object.values(leads).filter(l=>funnelEnts.some(e=>e.key===l.entKey));
  const _isInst=l=>Array.isArray(l.tags)&&l.tags.some(t=>_installTags.includes(t));
  const _instLeads=_fLeads.filter(_isInst);
  const _normLeads=_fLeads.filter(l=>!_isInst(l));
  const _uniqueInstNames=new Set(_instLeads.map(l=>(l.name||'').trim().toLowerCase()));
  const tventes=_normLeads.length+_uniqueInstNames.size;

  // Task history for monthly pie
  const taskHistory=await loadTasksHistory(cY,cM);
  const daysElapsed=(cY===now.getFullYear()&&cM===now.getMonth())?now.getDate():dim;
  const taskStats=TASKS.map(t=>{
    const done=Object.values(taskHistory).filter(day=>day&&day[t.id]===true).length;
    return {t,done,pct:daysElapsed>0?Math.round(done/daysElapsed*100):0};
  });
  const avgTaskPct=taskStats.length>0?Math.round(taskStats.reduce((s,ts)=>s+ts.pct,0)/taskStats.length):0;

  // Sparkline — TOUTES les métriques agrégées par jour
  const sparkDays=Math.min(dim,14);
  const sparkRaw=[];
  for(let d=Math.max(1,dim-sparkDays+1);d<=dim;d++){
    let t=0;ENTS.forEach(e=>getMet(e.key).forEach(m=>t+=gv(md,d,e.key,m.k)));
    sparkRaw.push(t);
  }
  const sMax=Math.max(...sparkRaw,1);
  const spark=(data,max,color)=>{
    if(!data||data.length<2)return '';
    const m=Math.max(max||1,1);
    const pts=data.map((v,i)=>`${i/(data.length-1)*60},${12-(v/m)*11}`).join(' ');
    return `<svg viewBox="0 0 60 12" class="kpi-spark"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  };
  // callsRaw for calls sparkline
  const callsRaw=[];
  for(let d=Math.max(1,dim-sparkDays+1);d<=dim;d++){let t=0;ENTS.forEach(e=>{t+=getTotalCalls(e.key,md[d]);});callsRaw.push(t);}

  // Graph conversion — hebdomadaire par entrepreneur (msgs → calls)
  const _wkDefs=[{label:'S1',s:1,e:7},{label:'S2',s:8,e:14},{label:'S3',s:15,e:21},{label:'S4',s:22,e:dim}];
  window._convWeekly=ENTS.map(e=>{
    const weeks=_wkDefs.map(({label,s,e:end})=>{
      let fm=0,calls=0;
      for(let d=s;d<=end;d++){fm+=gv(md,d,e.key,'firstmsg');calls+=getTotalCalls(e.key,md[d]);}
      return{label,msgs:fm,pct:fm>0?Math.round(calls/fm*100):null};
    });
    return{e,weeks};
  });

  // Ents data
  const entData=ENTS.map(e=>{
    let calls=0,fm=0,rep=0,ln=0,fu=0,rfu=0;
    for(let d=1;d<=dim;d++){calls+=getTotalCalls(e.key,md[d]);fm+=gv(md,d,e.key,'firstmsg');rep+=gv(md,d,e.key,'replies');ln+=gv(md,d,e.key,'lien');fu+=gv(md,d,e.key,'followup');rfu+=gv(md,d,e.key,'repliesfu');}
    const conv=fm>0?Math.round(calls/fm*100):0;
    const oc=obj[e.key]?.call||0;
    const op=oc>0?Math.min(Math.round(calls/oc*100),100):0;
    const rMan=parseFloat(rev[e.key]?.montant||0);
    const rL=Object.values(leads).filter(l=>l.entKey===e.key).reduce((s,l)=>s+(parseFloat(l.cashReceived)||0),0);
    const totR=rMan>0?rMan:rL;
    // comm = revenu manuel direct OU commission calculée sur leads
    const comm=rMan>0?rMan:rL*(e.rate/100);
    return{e,calls,fm,rep,ln,fu,rfu,conv,oc,op,totR,comm};
  });
  const totalRev=entData.reduce((s,d)=>s+d.totR,0);

  // Tasks
  const tDone=TASKS.filter(t=>t.done).length;
  const tPct=tDone/TASKS.length;

  // Funnel filter state
  const ff=window.dashFunnelFilter||'gael';

  div.innerHTML=`
  <div class="dash-page">
    <div class="dash-header">
      <div class="dash-logo">
        <svg id="chameoSvg" class="chameo-logo-img" viewBox="0 0 80 60" onclick="blink()"></svg>
        <div>
          <div class="dash-title"><span class="s">SETTER </span><span class="t">TRACKER</span></div>
          <div class="dash-sub">// ${MFR[cM].toUpperCase()} ${cY}</div>
        </div>
      </div>
      <div class="dash-clock">
        <div class="dash-time" id="dashClock">--:--:--</div>
        <div class="dash-date-lbl">${now.toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'})}</div>
      </div>
    </div>

    <!-- KPI -->
    <div class="kpi-row">
      <div id="podiumCard" class="kpi-card" style="padding:0;position:relative;min-height:130px;box-shadow:none!important;">
        <div id="podiumCanvas" style="position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:hidden;"></div>
      </div>
      <div class="kpi-card gold-corner" style="--kc:#34d399">
        <div class="gc-bl"></div><div class="gc-br"></div>
        <div class="kpi-label">MA PART CE MOIS</div>
        <div class="kpi-val">${formatAmount(myPart)}€</div>
        ${(()=>{
          const obj=window._objectifRevenu||0;
          if(!obj)return'';
          const pct=Math.min(Math.round(myPart/obj*100),100);
          const pctColor=pct>=100?'#ffd700':'#a78bfa';
          return`<div style="margin:4px 0 2px;display:flex;justify-content:space-between;align-items:baseline">
            <span style="font-family:'Space Mono',monospace;font-size:9px;color:rgba(255,255,255,0.35);letter-spacing:0.5px">${formatAmount(myPart)}€ / ${obj.toLocaleString('fr-FR')}€</span>
            <span style="font-family:'Orbitron',monospace;font-size:9px;font-weight:700;color:${pctColor}">${pct}%</span>

// ===== IRON MAN CHARTS =====
function splinePath(ctx, pts, tension=0.25){
  if(pts.length<2)return;
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++){
    const p0=pts[Math.max(0,i-2)];
    const p1=pts[i-1];
    const p2=pts[i];
    const p3=pts[Math.min(pts.length-1,i+1)];
    const cp1x=p1.x+(p2.x-p0.x)*tension;
    const cp1y=p1.y+(p2.y-p0.y)*tension;
    const cp2x=p2.x-(p3.x-p1.x)*tension;
    const cp2y=p2.y-(p3.y-p1.y)*tension;
    ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,p2.x,p2.y);
  }
}

function drawTasksPie(taskStats, daysElapsed){
  const canvas=document.getElementById('tasksPie');
  if(!canvas)return;
  const CW=280, CH=140;
  const W=CW*2, H=CH*2;
  canvas.width=W; canvas.height=H;
  canvas.style.width=CW+'px'; canvas.style.height=CH+'px';
  const ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';

  // [highlight, base, side-top, side-bottom]
  const pal=[
    ['#a8f4ff','#0ea5e9','#024d7a','#011830'],
    ['#ecdcff','#a855f7','#5b1a9e','#280640'],
    ['#88ffd0','#10b981','#034d30','#011a10'],
    ['#fff0a0','#f59e0b','#7a3a04','#2e1200'],
    ['#ffa8b8','#ef4444','#7a1010','#300404'],
    ['#ffbeec','#ec4899','#7a1040','#300018'],
    ['#b8d8ff','#3b82f6','#112a7a','#040e30'],
  ];

  const cx=W/2, cy=H*0.35;
  const rx=W*0.40, ry=rx*0.34;
  const depth=Math.round(H*0.19);
  const explode=7;

  const total=taskStats.reduce((s,ts)=>s+Math.max(ts.done,0.15),0);
  ctx.clearRect(0,0,W,H);

  if(total===0){
    ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fill();
    return;
  }

  const slices=[];
  let angle=-Math.PI/2;
  taskStats.forEach((ts,i)=>{
    const sweep=(Math.max(ts.done,0.15)/total)*Math.PI*2;
    const p=pal[i%pal.length];
    const mid=angle+sweep/2;
    const ox=explode*Math.cos(mid);
    const oy=explode*Math.sin(mid)*(ry/rx);
    slices.push({start:angle,end:angle+sweep,mid,hi:p[0],base:p[1],sideT:p[2],sideB:p[3],ox,oy});
    angle+=sweep;
  });

  // Halo ambiant sous le pie — effet flottant
  const haloY=cy+depth*0.85;
  const halo=ctx.createRadialGradient(cx,haloY,0,cx,haloY,rx*1.05);
  halo.addColorStop(0,'rgba(100,120,255,0.18)');
  halo.addColorStop(0.5,'rgba(60,80,200,0.08)');
  halo.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.ellipse(cx,haloY,rx*1.05,ry*0.55,0,0,Math.PI*2);
  ctx.fillStyle=halo;ctx.fill();

  // Painter's algorithm : pour chaque slice (back→front), dessiner side wall PUIS top face
  const sorted=[...slices].sort((a,b)=>Math.sin(a.mid)-Math.sin(b.mid));
  sorted.forEach(({start,end,hi,base,sideT,sideB,mid,ox,oy})=>{
    const scx=cx+ox, scy=cy+oy;

    // Side wall — uniquement la portion front-facing (angles ∈ [0, π], sin ≥ 0)
    const visS=Math.max(start,0), visE=Math.min(end,Math.PI);
    if(visE>visS){
      ctx.beginPath();
      ctx.moveTo(scx+rx*Math.cos(visS), scy+ry*Math.sin(visS));
      ctx.ellipse(scx,scy,rx,ry,0,visS,visE);
      ctx.lineTo(scx+rx*Math.cos(visE), scy+ry*Math.sin(visE)+depth);
      ctx.ellipse(scx,scy+depth,rx,ry,0,visE,visS,true);
      ctx.closePath();
      const sg=ctx.createLinearGradient(scx,scy,scx,scy+depth);
      sg.addColorStop(0,sideT); sg.addColorStop(1,sideB);
      ctx.fillStyle=sg; ctx.fill();
    }

    // Top face — metallic specular
    ctx.beginPath();
    ctx.moveTo(scx,scy);
    ctx.ellipse(scx,scy,rx,ry,0,start,end);
    ctx.closePath();
    const hx=scx-rx*0.28, hy=scy-ry*0.5;
    const rg=ctx.createRadialGradient(hx,hy,0,scx,scy,rx*1.1);
    rg.addColorStop(0,'rgba(255,255,255,0.82)');
    rg.addColorStop(0.10,hi);
    rg.addColorStop(0.45,base);
    rg.addColorStop(1,base+'cc');
    ctx.fillStyle=rg; ctx.fill();

    // Inner glow boosté — clippé à la slice
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(scx,scy);
    ctx.ellipse(scx,scy,rx,ry,0,start,end);
    ctx.closePath();
    ctx.clip();
    const gcx=scx+rx*0.36*Math.cos(mid);
    const gcy=scy+ry*0.36*Math.sin(mid);
    const glow=ctx.createRadialGradient(gcx,gcy,0,gcx,gcy,rx*0.60);
    glow.addColorStop(0,hi+'ff');
    glow.addColorStop(0.35,hi+'88');
    glow.addColorStop(0.7,hi+'22');
    glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow; ctx.fill();
    ctx.restore();

    // Rim light — trait lumineux sur le bord extérieur
    ctx.beginPath();
    ctx.ellipse(scx,scy,rx,ry,0,start,end);
    ctx.strokeStyle=hi+'99'; ctx.lineWidth=1.8; ctx.stroke();

    // Séparation sombre entre slices
    ctx.beginPath();
    ctx.moveTo(scx,scy);
    ctx.ellipse(scx,scy,rx,ry,0,start,end);
    ctx.closePath();
    ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=0.6; ctx.stroke();
  });

  // Dark center cap — couvre les interstices au centre entre slices explosées
  ctx.beginPath();ctx.ellipse(cx,cy,rx*0.16,ry*0.16,0,0,Math.PI*2);
  ctx.fillStyle='rgba(2,6,20,0.98)';ctx.fill();
}

function drawSparkIron(canvasId, data, color){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||120, H=28;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const max=Math.max(...data,1);
  const pts=data.map((v,i)=>({x:i/(data.length-1||1)*W, y:H-4-v/max*(H-8)}));
  // Area
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,color+'45'); grad.addColorStop(1,color+'00');
  ctx.beginPath(); splinePath(ctx,pts);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  // Line — net, zéro glow
  ctx.beginPath(); splinePath(ctx,pts);
  ctx.strokeStyle=color; ctx.lineWidth=1.3; ctx.lineCap='round'; ctx.stroke();
  // Tip
  const last=pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last.x,last.y,2,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
}
function draw3DActivity(md, dim){
  const cv=document.getElementById('activityChart3d');
  if(!cv)return;
  const DPR=window.devicePixelRatio||1;
  const W=cv.offsetWidth||240;
  const H=cv.offsetHeight||100;
  cv.width=W*DPR; cv.height=H*DPR;
  const ctx=cv.getContext('2d');
  ctx.scale(DPR,DPR);

  const acts=ENTS.map(e=>{
    let t=0;
    for(let d=1;d<=dim;d++){t+=gv(md,d,e.key,'firstmsg');t+=gv(md,d,e.key,'followup');t+=gv(md,d,e.key,'lien');}
    return{e,total:t};
  });
  const maxVal=Math.max(...acts.map(a=>a.total),1);

  const DX=9,DY=-5,fCells=4;
  const PL=10,PR=DX*fCells+12,PT=20,PB=24;
  const cW=W-PL-PR,cH=H-PT-PB;
  const n=acts.length,slot=cW/n;
  const barW=Math.floor(slot*0.50);
  const baseY=PT+cH;

  // ── SOL ISOMÉTRIQUE ──
  const fDX=DX*fCells, fDY=DY*fCells;
  const fL=PL, fR=W-PR;

  // Remplissage sol
  ctx.beginPath();
  ctx.moveTo(fL,baseY);ctx.lineTo(fR,baseY);
  ctx.lineTo(fR+fDX,baseY+fDY);ctx.lineTo(fL+fDX,baseY+fDY);
  ctx.closePath();
  ctx.fillStyle='rgba(0,180,255,0.048)';ctx.fill();

  // Gradient violet-rose → cyan au centre du sol
  const gcx=(fL+fR)/2+fDX*0.5;
  const gcy=baseY+fDY*0.5;
  const gcr=Math.max((fR-fL)*0.55, 60);
  const solGrad=ctx.createRadialGradient(gcx,gcy,0,gcx,gcy,gcr);
  solGrad.addColorStop(0,'rgba(180,50,255,0.18)');
  solGrad.addColorStop(0.35,'rgba(100,40,255,0.10)');
  solGrad.addColorStop(0.7,'rgba(0,180,255,0.05)');
  solGrad.addColorStop(1,'rgba(0,180,255,0)');
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(fL,baseY);ctx.lineTo(fR,baseY);
  ctx.lineTo(fR+fDX,baseY+fDY);ctx.lineTo(fL+fDX,baseY+fDY);
  ctx.closePath();
  ctx.fillStyle=solGrad;ctx.fill();
  ctx.restore();

  // Lignes horizontales en profondeur (sans la ligne avant — dessinée après les tours)
  for(let row=1;row<=fCells;row++){
    const t=row/fCells;
    const x0=fL+t*fDX, y0=baseY+t*fDY;
    const x1=fR+t*fDX;
    ctx.strokeStyle='rgba(0,200,255,0.12)';ctx.lineWidth=0.4;
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y0);ctx.stroke();
  }
  // Lignes diagonales
  const gCols=Math.round((fR-fL)/16);
  for(let col=0;col<=gCols;col++){
    const t=col/gCols;
    const x0=fL+t*(fR-fL);
    ctx.strokeStyle='rgba(0,200,255,0.10)';ctx.lineWidth=0.4;
    ctx.beginPath();ctx.moveTo(x0,baseY);ctx.lineTo(x0+fDX,baseY+fDY);ctx.stroke();
  }

  // Lignes de référence chart
  ctx.setLineDash([2,5]);
  for(let i=1;i<=3;i++){
    const gy=baseY-cH*i/3;
    ctx.strokeStyle='rgba(255,255,255,0.025)';ctx.lineWidth=0.4;
    ctx.beginPath();ctx.moveTo(fL,gy);ctx.lineTo(fR,gy);ctx.stroke();
  }
  ctx.setLineDash([]);

  acts.forEach((a,i)=>{
    const hex=a.e.hex;
    const r=parseInt(hex.slice(1,3),16);
    const g=parseInt(hex.slice(3,5),16);
    const b=parseInt(hex.slice(5,7),16);
    const barH=a.total>0?Math.max(cH*(a.total/maxVal),4):0;
    const bx=PL+i*slot+(slot-barW)/2;
    const barTop=baseY-barH;

    if(!barH){
      ctx.save();ctx.font=`700 10px 'Orbitron',monospace`;ctx.textAlign='center';
      ctx.shadowColor=`rgba(${r},${g},${b},0.5)`;ctx.shadowBlur=3;
      ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.fillText(a.e.name.slice(0,2).toUpperCase(),bx+barW/2,baseY+19);ctx.restore();
      return;
    }

    // FACE DROITE — très sombre, métallique
    ctx.beginPath();
    ctx.moveTo(bx+barW,barTop);ctx.lineTo(bx+barW+DX,barTop+DY);
    ctx.lineTo(bx+barW+DX,baseY+DY);ctx.lineTo(bx+barW,baseY);
    ctx.closePath();
    const rg=ctx.createLinearGradient(bx+barW,0,bx+barW+DX,0);
    rg.addColorStop(0,`rgba(${Math.floor(r*.22)},${Math.floor(g*.22)},${Math.floor(b*.22)},0.97)`);
    rg.addColorStop(1,`rgba(${Math.floor(r*.10)},${Math.floor(g*.10)},${Math.floor(b*.10)},0.97)`);
    ctx.fillStyle=rg;ctx.fill();
    ctx.strokeStyle=`rgba(${r},${g},${b},0.12)`;ctx.lineWidth=0.4;ctx.stroke();

    // FACE AVANT — dégradé métallique haut→bas
    const fg=ctx.createLinearGradient(bx,barTop,bx,baseY);
    fg.addColorStop(0,`rgba(${Math.min(r+50,255)},${Math.min(g+50,255)},${Math.min(b+50,255)},0.72)`);
    fg.addColorStop(0.4,`rgba(${r},${g},${b},0.58)`);
    fg.addColorStop(1,`rgba(${Math.floor(r*.4)},${Math.floor(g*.4)},${Math.floor(b*.4)},0.50)`);
    ctx.fillStyle=fg;ctx.fillRect(bx,barTop,barW,barH);
    // Reflet diagonal
    const dg=ctx.createLinearGradient(bx,barTop,bx+barW*.5,barTop+barH*.35);
    dg.addColorStop(0,'rgba(255,255,255,0.11)');dg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=dg;ctx.fillRect(bx,barTop,barW,barH);
    ctx.strokeStyle=`rgba(${r},${g},${b},0.50)`;ctx.lineWidth=0.5;ctx.strokeRect(bx,barTop,barW,barH);

    // FACE TOP — spéculaire, la plus lumineuse
    ctx.beginPath();
    ctx.moveTo(bx,barTop);ctx.lineTo(bx+DX,barTop+DY);
    ctx.lineTo(bx+barW+DX,barTop+DY);ctx.lineTo(bx+barW,barTop);
    ctx.closePath();
    const tg=ctx.createLinearGradient(bx,barTop,bx+barW,barTop+DY);
    tg.addColorStop(0,`rgba(${Math.min(r+120,255)},${Math.min(g+120,255)},${Math.min(b+120,255)},0.95)`);
    tg.addColorStop(1,`rgba(${Math.min(r+60,255)},${Math.min(g+60,255)},${Math.min(b+60,255)},0.78)`);
    ctx.fillStyle=tg;ctx.fill();
    // Arête top lumineuse
    ctx.save();
    ctx.shadowColor=`rgba(${r},${g},${b},0.55)`;ctx.shadowBlur=5;
    ctx.strokeStyle=`rgba(${Math.min(r+160,255)},${Math.min(g+160,255)},${Math.min(b+160,255)},0.88)`;
    ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(bx+DX,barTop+DY);ctx.lineTo(bx+barW+DX,barTop+DY);ctx.stroke();
    ctx.restore();
    ctx.strokeStyle=`rgba(${r},${g},${b},0.35)`;ctx.lineWidth=0.4;ctx.stroke();

    // Valeur
    ctx.save();
    ctx.font=`700 8px 'Space Mono',monospace`;ctx.textAlign='center';
    ctx.shadowColor=`rgba(${r},${g},${b},0.85)`;ctx.shadowBlur=7;
    ctx.fillStyle=`rgb(${Math.min(r+60,255)},${Math.min(g+60,255)},${Math.min(b+60,255)})`;
    ctx.fillText(a.total,bx+barW/2+DX/2,barTop+DY-4);
    ctx.restore();
    // Nom — blanc pur + glow coloré serré
    ctx.save();
    ctx.font=`700 10px 'Orbitron',monospace`;ctx.textAlign='center';
    ctx.shadowColor=`rgba(${r},${g},${b},0.9)`;ctx.shadowBlur=4;
    ctx.fillStyle='#ffffff';
    ctx.fillText(a.e.name.slice(0,2).toUpperCase(),bx+barW/2,baseY+19);
    ctx.restore();
  });

  // Ligne de base — dessinée en dernier, passe au-dessus des tours
  ctx.save();
  ctx.shadowColor='rgba(0,210,255,0.55)';ctx.shadowBlur=6;
  ctx.strokeStyle='rgba(0,220,255,0.55)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(fL,baseY);ctx.lineTo(fR,baseY);ctx.stroke();
  ctx.restore();

  // ── PARTICULES DE DONNÉES ──
  if(window._activityParticleRAF){cancelAnimationFrame(window._activityParticleRAF);window._activityParticleRAF=null;}
  let pcv=document.getElementById('activityParticles');
  if(pcv){pcv.remove();}
  const cvParent=cv.parentElement;
  cvParent.style.position='relative';
  pcv=document.createElement('canvas');
  pcv.id='activityParticles';
  pcv.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2';
  cvParent.appendChild(pcv);
  pcv.width=cv.width; pcv.height=cv.height;
  const pctx=pcv.getContext('2d');
  pctx.scale(DPR,DPR);
  const _pBounds={fL,fR,fDX,fDY,baseY};
  const _pColors=['rgba(0,200,255,A)','rgba(160,60,255,A)','rgba(80,140,255,A)'];
  const _parts=[];
  function _spawnPart(){
    const t=Math.random(),s=Math.random();
    const x=_pBounds.fL+s*(_pBounds.fR-_pBounds.fL)+t*_pBounds.fDX;
    const y=_pBounds.baseY+t*_pBounds.fDY;
    _parts.push({x,y,vx:(Math.random()-0.5)*0.12,vy:-(0.12+Math.random()*0.20),
      life:0,maxLife:90+Math.floor(Math.random()*90),
      sz:0.6+Math.random()*0.9,col:_pColors[Math.floor(Math.random()*3)],
      maxA:0.04+Math.random()*0.09});
  }
  function _tickParts(){
    pctx.clearRect(0,0,W,H);
    if(Math.random()<0.055&&_parts.length<28)_spawnPart();
    for(let i=_parts.length-1;i>=0;i--){
      const p=_parts[i];p.x+=p.vx;p.y+=p.vy;p.life++;
      if(p.life>=p.maxLife){_parts.splice(i,1);continue;}
      const t=p.life/p.maxLife;
      const a=t<0.2?(t/0.2)*p.maxA:t>0.7?((1-t)/0.3)*p.maxA:p.maxA;
      pctx.fillStyle=p.col.replace('A',a.toFixed(3));
      pctx.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz);
    }
    window._activityParticleRAF=requestAnimationFrame(_tickParts);
  }
  _tickParts();
}

function drawConvChart(){
  const canvas=document.getElementById('convChart');
  if(!canvas)return;
  const data=window._convWeekly;
  if(!data||!data.length)return;
  const wrap=canvas.parentElement;
  const W=canvas.getBoundingClientRect().width||canvas.offsetWidth||wrap&&wrap.getBoundingClientRect().width||wrap&&wrap.offsetWidth||(window.innerWidth-32)||300;
  const H=canvas.getBoundingClientRect().height||canvas.offsetHeight||wrap&&wrap.getBoundingClientRect().height||wrap&&wrap.offsetHeight||200;
  if(W<10||H<10)return;
  if(!canvas.style.width||canvas.style.width==='100%')canvas.style.width=W+'px';
  const dpr=window.devicePixelRatio||1;
  const nW=Math.round(W*dpr),nH=Math.round(H*dpr);
  if(canvas.width!==nW||canvas.height!==nH){canvas.width=nW;canvas.height=nH;}
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.shadowBlur=0;ctx.shadowColor='transparent';
  ctx.clearRect(0,0,W,H);

  function rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

  const pTop=28,pBot=38;
  const chartH=H-pTop-pBot;
  const secW=W/data.length;
  const nWk=(data[0]&&data[0].weeks.length)||4;
  const BR=Math.max(6,Math.min(17,(secW-20)/(2*nWk)));
  const sPad=BR+10;

  const allPcts=data.flatMap(d=>d.weeks.filter(w=>w.pct!==null).map(w=>w.pct));
  const rawMax=allPcts.length>0?Math.max(...allPcts):20;
  const scaleMax=rawMax<=15?20:rawMax<=30?40:rawMax<=50?60:rawMax<=75?80:100;
  function yFor(p){
    const raw=pTop+chartH-((p||0)/scaleMax)*chartH;
    return Math.max(pTop+BR+10,Math.min(H-pBot-BR-10,raw));
  }

  // ── SEPARATEURS ──────────────────────────────────────────────────
  for(let i=1;i<data.length;i++){
    const sx=i*secW;
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(sx,pTop-6);ctx.lineTo(sx,H-pBot+6);ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── SECTIONS ─────────────────────────────────────────────────────
  data.forEach(({e,weeks},si)=>{
    const[cr,cg,cb]=rgb(e.hex);
    const sLeft=si*secW;
    const innerW=secW-sPad*2;
    const n=weeks.length;
    const bxs=weeks.map((_,j)=>sLeft+sPad+(n>1?j/(n-1):0.5)*innerW);
    const bys=weeks.map(w=>yFor(w.pct!==null?w.pct:0));

    // Nom entrepreneur — gravure métallique, gradient dans les lettres
    const _nm=e.name.toUpperCase();
    ctx.font=`700 10px "Orbitron",monospace`;
    const _nx=sLeft+secW/2,_ny=18;
    const _mg=ctx.createLinearGradient(_nx,_ny-11,_nx,_ny+1);
    _mg.addColorStop(0,'rgba(235,248,255,0.97)');
    _mg.addColorStop(0.38,`rgba(${Math.round(cr*0.35+158)},${Math.round(cg*0.35+155)},${Math.round(cb*0.35+158)},0.92)`);
    _mg.addColorStop(1,'rgba(105,125,148,0.82)');
    ctx.fillStyle=_mg;
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.shadowBlur=0;ctx.fillText(_nm,_nx,_ny);

    // Connecteur — fil d'énergie avec gradient
    ctx.save();
    const lg=ctx.createLinearGradient(bxs[0],0,bxs[n-1],0);
    lg.addColorStop(0,`rgba(${cr},${cg},${cb},0.15)`);
    lg.addColorStop(0.5,`rgba(${cr},${cg},${cb},0.55)`);
    lg.addColorStop(1,`rgba(${cr},${cg},${cb},0.15)`);
    ctx.beginPath();
    bxs.forEach((bx,j)=>{
      if(j===0){ctx.moveTo(bx,bys[j]);}
      else{const cpx=(bxs[j-1]+bx)/2;ctx.bezierCurveTo(cpx,bys[j-1],cpx,bys[j],bx,bys[j]);}
    });
    ctx.strokeStyle=lg;ctx.lineWidth=1.5;ctx.lineCap='round';ctx.stroke();
    ctx.restore();

    // Bulles — effet sphère 3D
    weeks.forEach((w,j)=>{
      const bx=bxs[j],by=bys[j];
      const has=w.msgs>0;

      // Halo externe (glow)
      if(has){
        ctx.shadowBlur=20;ctx.shadowColor=`rgba(${cr},${cg},${cb},0.55)`;
      }
      // Anneau extérieur
      ctx.beginPath();ctx.arc(bx,by,BR,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${cr},${cg},${cb},${has?0.95:0.35})`;
      ctx.lineWidth=has?2:1;ctx.stroke();
      ctx.shadowBlur=0;

      // Fond sphère — radial gradient (lumière en haut-gauche)
      const rg=ctx.createRadialGradient(bx-BR*0.35,by-BR*0.35,BR*0.05,bx,by,BR);
      if(has){
        rg.addColorStop(0,`rgba(${Math.min(cr+60,255)},${Math.min(cg+40,255)},${Math.min(cb+40,255)},0.35)`);
        rg.addColorStop(0.5,`rgba(${cr},${cg},${cb},0.12)`);
        rg.addColorStop(1,`rgba(2,6,16,0.96)`);
      } else {
        rg.addColorStop(0,'rgba(30,35,50,0.5)');
        rg.addColorStop(1,'rgba(2,6,16,0.95)');
      }
      ctx.beginPath();ctx.arc(bx,by,BR-0.5,0,Math.PI*2);
      ctx.fillStyle=rg;ctx.fill();

      // Reflet spéculaire — tache lumineuse en haut-gauche
      if(has){
        const sg=ctx.createRadialGradient(bx-BR*0.38,by-BR*0.38,0,bx-BR*0.38,by-BR*0.38,BR*0.55);
        sg.addColorStop(0,'rgba(255,255,255,0.45)');
        sg.addColorStop(0.5,'rgba(255,255,255,0.12)');
        sg.addColorStop(1,'rgba(255,255,255,0)');
        ctx.beginPath();ctx.arc(bx,by,BR-0.5,0,Math.PI*2);
        ctx.fillStyle=sg;ctx.fill();
      }

      // Texte %
      const txt=w.pct!==null?(w.pct+'%'):'—';
      ctx.font=`700 ${Math.max(6,Math.round(BR*0.55))}px "Orbitron",monospace`;
      ctx.shadowBlur=4;ctx.shadowColor='rgba(0,0,10,0.95)';
      ctx.fillStyle=has?'rgba(255,255,255,0.97)':'rgba(255,255,255,0.25)';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(txt,bx,by+0.5);
      ctx.shadowBlur=0;ctx.textBaseline='alphabetic';

      // Label semaine
      ctx.font=`600 7.5px "Space Mono",monospace`;
      ctx.fillStyle=`rgba(0,190,255,0.80)`;
      ctx.textAlign='center';
      ctx.fillText(w.label,bx,H-pBot+13);

      // Volume msgs
      ctx.font=`500 7px "Space Mono",monospace`;
      ctx.fillStyle=has?`rgba(${cr},${cg},${cb},0.70)`:'rgba(255,255,255,0.35)';
      ctx.fillText(w.msgs+'m',bx,H-pBot+24);
    });

    // Delta semaine
    const wd=weeks.filter(w=>w.msgs>0);
    if(wd.length>=2){
      const last=wd[wd.length-1],prev=wd[wd.length-2];
      const delta=(last.pct||0)-(prev.pct||0);
      const lj=weeks.indexOf(last);
      const bx=bxs[lj],by=bys[lj];
      ctx.font=`700 8.5px "Space Mono",monospace`;
      ctx.fillStyle=delta>=0?'rgba(52,211,153,0.95)':'rgba(239,68,68,0.95)';
      ctx.shadowBlur=3;ctx.shadowColor='rgba(0,0,0,0.9)';
      ctx.textAlign='center';ctx.textBaseline='alphabetic';
      ctx.fillText((delta>=0?'▲':'▼')+Math.abs(delta)+'%',bx,by-BR-6);
      ctx.shadowBlur=0;
    }
  });
  ctx.shadowBlur=0;ctx.shadowColor='transparent';
}

async function renderJour(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  const div=document.getElementById('page_jour');
  const md=await loadMonth(cY,cM);
  const leadsDay=await loadLeads(cY,cM);

  const offset=firstDay===0?6:firstDay-1;

  let dayTotal=0;ENTS.forEach(e=>getMet(e.key).forEach(m=>dayTotal+=gv(md,selDay,e.key,m.k)));

  // Calendar with richer cells
  let calCells='';
  for(let i=0;i<offset;i++)calCells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=dim;d++){
    let total=0;const dots={};
    ENTS.forEach(e=>{
      let s=0;getMet(e.key).forEach(m=>s+=gv(md,d,e.key,m.k));
      if(s>0){dots[e.key]={color:e.hex,sum:s};total+=s;}
    });
    const isToday=d===now.getDate()&&cM===now.getMonth()&&cY===now.getFullYear();
    const isSel=d===selDay;

        const call=gv(md,selDay,e.key,'call');
        const totalCalls=getTotalCalls(e.key,md[selDay]);
        // Leads closés ce jour par cet entrepreneur
        const todayLeads=Object.values(leadsDay).filter(l=>l.entKey===e.key&&l.date===new Date().toLocaleDateString('fr-BE')).length;

          +statRow('FU → Réponses FU',pctFuRfu,e.hex)
          +statRow('Msgs+FU → Call',pctMsgCall,e.hex)
          +statRow('Call → Vente',pctCallVente,'#34d399')

          +'</div>';
      }).join('')}
    </div>

    <div class="tasks-wrap">
      <div class="tasks-bg-grid"></div>
      <div class="tasks-head">

          <div class="tasks-sub">// PROTOCOLE JOURNALIER</div>

      </div>
      <div class="scan-line" id="scanLine"></div>

  startRingAnim('jourRing',()=>TASKS.filter(t=>t.done).length/TASKS.length,70);

function animateScan(){
  const s=document.getElementById('scanLine');if(!s)return;
  const wrap=s.parentElement;if(!wrap)return;
  let pos=0;clearInterval(window._scanInt);
  window._scanInt=setInterval(()=>{pos+=1;if(pos>wrap.offsetHeight||0)pos=0;s.style.top=pos+'px';},16);
}

function toggleTask(id){
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;
  applyTaskDoneUI();
  set(ref(db,'tasks_done/'+todayKey()+'/'+id),t.done).catch(()=>{});
}
window.toggleTask=toggleTask;

window.dashFunnelFilter='gael';

function rebuildFunnel(ff){
  const card=document.getElementById('funnelCard');
  if(!card||!window._dashCache)return;
  const {md,leads,dim}=window._dashCache;
  const funnelEnts=ENTS.filter(e=>e.key===ff);
  let tfm=0,trep=0,tfu=0,trfu=0,tln=0,tc=0;
  for(let d=1;d<=dim;d++)funnelEnts.forEach(e=>{
    tfm+=gv(md,d,e.key,'firstmsg');trep+=gv(md,d,e.key,'replies');
    tfu+=gv(md,d,e.key,'followup');trfu+=gv(md,d,e.key,'repliesfu');
    tln+=gv(md,d,e.key,'lien');tc+=getTotalCalls(e.key,md[d]);
  });
  const pct=(a,b)=>b>0?Math.round(a/b*100):0;
  const _installTags=['x2','x3','à compte'];
  const _fLeads=Object.values(leads).filter(l=>funnelEnts.some(e=>e.key===l.entKey));
  const _isInst=l=>Array.isArray(l.tags)&&l.tags.some(t=>_installTags.includes(t));
  const _instLeads=_fLeads.filter(_isInst);
  const _normLeads=_fLeads.filter(l=>!_isInst(l));
  const _uniqueInstNames=new Set(_instLeads.map(l=>(l.name||'').trim().toLowerCase()));
  const tventes=_normLeads.length+_uniqueInstNames.size;
  const fs=[
    {l:'MSG → RÉP',      v:pct(trep,tfm),       c:'#00d4ff'},
    {l:'F/U → RÉP F/U',  v:pct(trfu,tfu),       c:'#3b82f6'},
    {l:'MSG+F/U → LIEN', v:pct(tln,tfm+tfu),    c:'#34d399'},
    {l:'LIEN → CALL',    v:pct(tc,tln),          c:'#a78bfa'},
    {l:'CALL → VENTE',   v:pct(tventes,tc),      c:'#fb923c'},
  ];
  const rows=fs.map((f,i)=>{
    const w=Math.min(Math.max(f.v,0),100);
    const conn=i<fs.length-1?'<div class="fstat-connector">↓</div>':'';
    return'<div class="fstat-step"><div class="fstat-header">'
      +'<span class="fstat-num" style="color:'+f.c+'">0'+(i+1)+'</span>'
      +'<span class="fstat-lbl">'+f.l+'</span>'
      +'<span class="fstat-pct" style="color:'+f.c+'">'+f.v+'%</span>'
      +'</div><div class="fstat-track">'
      +'<div class="fstat-fill" style="width:'+w+'%;background:linear-gradient(90deg,'+f.c+','+f.c+'77);box-shadow:0 0 8px '+f.c+'55,0 0 2px '+f.c+'"></div>'
      +'</div></div>'+conn;
  }).join('');
  card.innerHTML='<div class="gc-bl"></div><div class="gc-br"></div>'
    +'<div class="funnel-title">FUNNEL CONVERSION</div>'
    +'<div class="funnel-filters">'
    +ENTS.map(e=>{const active=ff===e.key;return`<button class="funnel-filter-btn${active?' active':''}" onclick="window.setDashFunnelFilter('${e.key}')" style="${active?`background:${e.hex};color:#000;border-color:${e.hex}`:`color:${e.hex};border-color:${e.hex}44`}">${e.name}</button>`;}).join('')
    +'</div>'
    +'<div class="funnel-3d">'+rows+'</div>';
}

window.setDashFunnelFilter=function(k){window.dashFunnelFilter=k;rebuildFunnel(k);};

window.metricAdd=async function(ek){
  const lblEl=document.getElementById('newmet_lbl_'+ek);
  const keyEl=document.getElementById('newmet_key_'+ek);
  if(!lblEl||!keyEl)return;
  const lbl=lblEl.value.trim();
  let key=keyEl.value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!lbl){alert('Donne un nom à cette action.');return;}
  if(!key)key=lbl.toLowerCase().replace(/[^a-z0-9]/g,'').substring(0,12)||('m'+Date.now());
  const metrics=getMet(ek);
  if(metrics.find(m=>m.k===key)){alert('Cette clé existe déjà, choisis une autre clé.');return;}
  const newMetrics=[...metrics,{k:key,l:lbl}];
  METRICS[ek]=newMetrics;
  METRIC_ORDER[ek]=newMetrics.map(m=>m.k);
  try{
    await set(ref(db,'config/metrics/'+ek),newMetrics);
    await set(ref(db,'config/metricOrder/'+ek),METRIC_ORDER[ek]);
    lblEl.value='';keyEl.value='';
  }catch(e){alert('Erreur sauvegarde: '+e.message);}
  window.renderParams();
};

window.metricDel=async function(ek,mk){
  if(!confirm('Supprimer cette action ? Les données existantes sont conservées mais elle ne sera plus affichée.'))return;
  const metrics=getMet(ek).filter(m=>m.k!==mk);
  if(metrics.length===0){alert('Impossible de supprimer la dernière action.');return;}
  METRICS[ek]=metrics;
  METRIC_ORDER[ek]=metrics.map(m=>m.k);
  try{
    await set(ref(db,'config/metrics/'+ek),metrics);
    await set(ref(db,'config/metricOrder/'+ek),METRIC_ORDER[ek]);
  }catch(e){alert('Erreur: '+e.message);}
  window.renderParams();
};

window.metricRename=async function(ek,mk,newLabel){
  if(!newLabel.trim())return;
  const metrics=getMet(ek).map(m=>m.k===mk?{k:m.k,l:newLabel.trim()}:m);
  METRICS[ek]=metrics;
  try{await set(ref(db,'config/metrics/'+ek),metrics);}catch(e){}
};

window.metricMoveUp=async function(ek,idx){
  const order=getMetricsOrdered(ek).map(m=>m.k);
  if(idx===0)return;
  [order[idx-1],order[idx]]=[order[idx],order[idx-1]];
  await saveMetricOrder(ek,order);
  window.renderParams();
};
window.metricMoveDown=async function(ek,idx){
  const order=getMetricsOrdered(ek).map(m=>m.k);
  if(idx>=order.length-1)return;
  [order[idx],order[idx+1]]=[order[idx+1],order[idx]];
  await saveMetricOrder(ek,order);
  window.renderParams();
};

window.taskMove=async function(id,dir){

  if(idx<0)return;
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=TASKS.length)return;
  [TASKS[idx],TASKS[newIdx]]=[TASKS[newIdx],TASKS[idx]];
  await saveTasksConfig();
  window.renderParams();
};

async function loadMetrics(){
  try{
    const s=await get(ref(db,'config/metrics'));
    if(s.exists()){
      const data=s.val();
      Object.keys(data).forEach(ek=>{
        let arr=data[ek];
        // Firebase stores arrays as objects {0:{...},1:{...}} - convert back
        if(arr&&typeof arr==='object'&&!Array.isArray(arr)){
          arr=Object.values(arr);
        }
        if(Array.isArray(arr)&&arr.length>0){
          const valid=arr.filter(m=>m&&typeof m.k==='string'&&m.k&&typeof m.l==='string'&&m.l&&m.l!=='undefined');
          if(valid.length>0)METRICS[ek]=valid;
        }
      });
    }
  }catch(e){}
}
