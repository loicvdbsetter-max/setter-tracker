// ── 1. Background particle + grid canvas ──────────────────────────
;(function initBgCanvas(){
  const cv=document.createElement('canvas');
  cv.id='bgCanvas';
  Object.assign(cv.style,{position:'fixed',inset:'0',zIndex:'0',pointerEvents:'none',width:'100%',height:'100%'});
  document.body.insertBefore(cv,document.body.firstChild);
  const ctx=cv.getContext('2d');
  let W,H,t=0,raf=null;
  const CYAN='rgba(0,212,255,';
  const GOLD='rgba(200,160,80,';
  // Particles — fractional coords (0..1) for responsiveness
  const pts=Array.from({length:60},()=>({
    x:Math.random(),y:Math.random(),
    z:0.5+Math.random()*2.5,
    vx:(Math.random()-0.5)*0.00022,
    vy:(Math.random()-0.5)*0.00014,
    a:0.07+Math.random()*0.16,
    col:Math.random()>0.70?GOLD:CYAN,
    r:0.35+Math.random()*1.1,
  }));
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  resize();
  addEventListener('resize',resize,{passive:true});
  function draw(){
    t++;
    ctx.clearRect(0,0,W,H);
    // Moving horizontal grid (slow drift downward)
    const gs=76, gOff=((t*0.11)%gs);
    ctx.lineWidth=0.4;
    for(let y=gOff;y<H+gs;y+=gs){
      ctx.strokeStyle=CYAN+(0.013+y/H*0.018)+')';
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
    // Vertical grid (static)
    ctx.strokeStyle=CYAN+'0.01)';
    for(let x=0;x<W;x+=gs){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    // Ambient bloom spots
    const blooms=[
      [W*0.16,H*0.28,240,CYAN,'0.038'],
      [W*0.84,H*0.68,210,GOLD,'0.028'],
      [W*0.50,H*0.04,300,CYAN,'0.032'],
    ];
    blooms.forEach(([bx,by,br,bc,ba])=>{
      const g=ctx.createRadialGradient(bx,by,0,bx,by,br);
      g.addColorStop(0,bc+ba+')');g.addColorStop(1,bc+'0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill();
    });
    // Particles
    pts.forEach(p=>{
      p.x=(p.x+p.vx+1)%1;p.y=(p.y+p.vy+1)%1;
      const pulse=0.68+Math.sin(t*0.022+p.z*1.2)*0.32;
      ctx.globalAlpha=p.a*pulse;
      ctx.fillStyle=p.col+'1)';
      ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
    raf=requestAnimationFrame(draw);
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden&&raf){cancelAnimationFrame(raf);raf=null;}
    else if(!document.hidden&&!raf)draw();
  });
  draw();
})();

// ── 2. Cursor ambient glow (desktop only) ─────────────────────────
;(function initCursorGlow(){
  if(matchMedia('(hover:none),(max-width:768px)').matches)return;
  const g=document.createElement('div');g.id='cursorGlow';
  document.body.appendChild(g);
  let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;},{passive:true});
  function tick(){
    cx+=(mx-cx)*0.09;cy+=(my-cy)*0.09;
    g.style.left=cx+'px';g.style.top=cy+'px';
    requestAnimationFrame(tick);
  }
  tick();
})();


// ── 4. Card 3D mouse tilt (desktop only) ──────────────────────────
;(function initTilt(){
  if(matchMedia('(hover:none),(max-width:768px)').matches)return;
  const SEL='.kpi-card,.graph-card,.funnel-card,.dash-ent-card,.rev-card-dash';
  document.addEventListener('mousemove',e=>{
    document.querySelectorAll(SEL).forEach(card=>{
      const r=card.getBoundingClientRect();
      const dx=(e.clientX-(r.left+r.width*.5))/r.width;
      const dy=(e.clientY-(r.top+r.height*.5))/r.height;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<0.85){
        const rx=-dy*7,ry=dx*7;
        card.style.transform=`perspective(520px) rotateX(${rx}deg) rotateY(${ry}deg) scale(1.018)`;
      } else {
        card.style.transform='';
      }
    });
  },{passive:true});
  document.addEventListener('mouseleave',()=>{
    document.querySelectorAll(SEL).forEach(c=>{c.style.transform='';});
  });
})();

// ── 5. KPI animated counter ───────────────────────────────────────
function _kpiCountUp(el,dur=680){
  const raw=el.textContent.trim();
  const num=parseFloat(raw.replace(/[^\d.,]/g,'').replace(',','.'));
  if(!num||isNaN(num))return;
  const suffix=raw.replace(/[\d.,]+/,'').trim();
  const t0=performance.now();
  (function step(now){
    const prog=Math.min((now-t0)/dur,1);
    const ease=1-(1-prog)*(1-prog)*(1-prog);
    el.textContent=formatAmount(num*ease)+suffix;
    if(prog<1)requestAnimationFrame(step);
    else el.textContent=raw;
  })(t0);
}
// Observe dash page for re-renders and animate KPI values
const _dashObs=new MutationObserver(()=>{
  setTimeout(()=>{
    document.querySelectorAll('#page_dash .kpi-val').forEach(el=>{
      if(!el.dataset.ca){el.dataset.ca='1';_kpiCountUp(el);}
    });
  },70);
});
_dashObs.observe(document.getElementById('page_dash'),{childList:true,subtree:false});

// ── 6. Tab switch — re-trigger page entrance animation ─────────────
const _origSwitchTab=window.switchTab;
window.switchTab=function(tab,el){
  _origSwitchTab(tab,el);
  const pg=document.getElementById('page_'+tab);
  if(pg){pg.style.animation='none';void pg.offsetWidth;pg.style.animation='';}
};
</script>
