<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Setter Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070a;--surface:rgba(15,23,42,0.62);--surface2:rgba(4,10,18,0.9);
  --border:#0d1a24;--border2:#1a2a35;
  --text:#e2e8f0;--muted:#2a4a5a;--muted2:#8aa8c0;
  --cyan:#00f2ff;--cyan2:#00d4ff;--cyan-glow:rgba(0,242,255,0.2);
  --glow:0 10px 30px rgba(0,0,0,0.55),0 0 0 1px rgba(0,242,255,0.15);
  --glow-strong:0 10px 40px rgba(0,0,0,0.7),0 0 0 1px rgba(0,242,255,0.3),0 0 30px rgba(0,242,255,0.18);
  --metal-border:linear-gradient(135deg,rgba(0,242,255,0.6) 0%,rgba(40,130,220,0.18) 35%,rgba(0,50,120,0.06) 65%,rgba(0,242,255,0.5) 100%);
  --laser:linear-gradient(90deg,transparent,#00f2ff,transparent);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  background:radial-gradient(ellipse at center,#0d1525 0%,#05070a 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Space Mono',monospace;min-height:100vh;
  position:relative;margin:0;
}
/* ===== HUD ANIMATIONS ===== */
@keyframes chameo-pulse{
  0%,100%{filter:drop-shadow(0 0 4px rgba(0,212,255,0.2));}
  50%{filter:drop-shadow(0 0 14px rgba(0,212,255,0.7)) drop-shadow(0 0 28px rgba(0,212,255,0.25));}
}
#chameoSvg{animation:chameo-pulse 4s ease-in-out infinite;position:relative;z-index:1;}
@keyframes ring-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.chameo-ring{position:relative;display:inline-flex;align-items:center;justify-content:center;width:72px;height:44px;}
.chameo-ring::before{
  content:'';position:absolute;inset:-10px;border-radius:50%;
  border:1.5px solid rgba(0,212,255,0.28);pointer-events:none;
  box-shadow:0 0 8px rgba(0,212,255,0.2),inset 0 0 8px rgba(0,212,255,0.08);
}
.chameo-ring::after{
  content:'';position:absolute;inset:-18px;border-radius:50%;
  border:1px dashed rgba(0,212,255,0.14);pointer-events:none;
  animation:ring-spin 14s linear infinite;
}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border2);background:#040810;position:sticky;top:0;z-index:100;}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 0;flex:1;border-bottom:2px solid transparent;cursor:pointer;transition:all 0.2s;user-select:none;position:relative;}
.tab::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0;transition:opacity 0.3s;}
.tab.active::after{opacity:1;}
.tab .ticon{width:22px;height:22px;flex-shrink:0;transition:filter 0.3s;}
.tab.active .ticon{filter:drop-shadow(0 0 5px rgba(0,212,255,0.8));}
.tab .tlbl{font-size:9px;letter-spacing:2px;color:var(--muted2);transition:color 0.2s;}
.tab.active .tlbl{color:var(--cyan);}
.tab:hover:not(.active) .tlbl{color:var(--text);}
.live-indicator{display:flex;align-items:center;gap:6px;padding:0 16px;border-left:1px solid var(--border2);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);}
.live-lbl{font-size:8px;color:rgba(0,212,255,0.4);letter-spacing:1px;}

/* PAGES */
.page{display:none;}
.page.active{display:block;}

/* ===== DASHBOARD ===== */
.dash-page{padding:20px;}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.dash-logo{display:flex;align-items:center;gap:14px;}
.dash-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:4px;line-height:1;}
.dash-title .s{background:linear-gradient(180deg,#e8f4ff,#a0b8cc,#6080a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.dash-title .t{color:var(--cyan);}
.dash-sub{font-size:7px;color:rgba(0,170,255,0.3);letter-spacing:2px;margin-top:2px;}
.dash-clock{text-align:right;}
.dash-time{font-size:9px;color:rgba(0,170,255,0.5);}
.dash-date-lbl{font-size:7px;color:rgba(0,170,255,0.25);margin-top:2px;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr) 2.4fr;gap:10px;margin-bottom:12px;}
.kpi-card{
  background:rgba(6,14,22,0.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:10px;padding:14px;
  position:relative;overflow:hidden;border:none;
  box-shadow:var(--glow);transition:box-shadow 0.4s;
}
.kpi-card:hover{box-shadow:var(--glow-strong);}
.kpi-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:var(--metal-border);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.kpi-card::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  --cc:rgba(0,212,255,0.9);--cs:18px;
  background:
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) top left/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) top right/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top right/1px var(--cs) no-repeat,
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) bottom left/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) bottom right/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom right/1px var(--cs) no-repeat;
}
.kpi-label{font-size:8px;color:rgba(0,170,255,0.5);letter-spacing:2px;margin-bottom:5px;}
.kpi-val{font-family:'Space Mono',monospace;font-size:1.5rem;letter-spacing:1px;line-height:1;color:var(--kc,var(--cyan));font-weight:700;}
.kpi-label{font-size:8px;color:rgba(180,220,255,0.6);letter-spacing:2px;margin-bottom:5px;}
.kpi-sub{font-size:8px;color:rgba(180,220,255,0.4);margin-top:3px;}
.kpi-sub{font-size:8px;color:rgba(0,170,255,0.3);margin-top:3px;}
.kpi-spark{width:100%;margin-top:6px;opacity:0.45;}

/* RING KPI CARD */
.kpi-ring-card{background:rgba(4,12,8,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:10px;padding:12px 12px 8px;position:relative;overflow:hidden;border:none;display:flex;flex-direction:column;align-items:center;box-shadow:var(--glow);}
.kpi-ring-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:var(--metal-border);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.kpi-ring-card::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  --cc:rgba(0,212,255,0.75);--cs:16px;
  background:
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) top left/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) top right/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top right/1px var(--cs) no-repeat,
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) bottom left/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) bottom right/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom right/1px var(--cs) no-repeat;
}
.kpi-ring-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);}
.kpi-ring-lbl{font-size:8px;color:rgba(0,212,255,0.4);letter-spacing:2px;margin-bottom:8px;}
.ring-container{position:relative;display:flex;align-items:center;justify-content:center;}
.ring-text-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:100%;}
.ring-pct{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;line-height:1;color:#ffffff;}
.ring-cnt{font-size:7px;color:rgba(0,212,255,0.4);margin-top:1px;}

/* MID ROW */
.mid-row{display:grid;grid-template-columns:3fr 2fr;gap:10px;margin-bottom:12px;}
.graph-card{
  background:rgba(6,14,22,0.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:none;border-radius:10px;padding:14px;
  position:relative;overflow:hidden;min-height:180px;display:flex;flex-direction:column;
  box-shadow:var(--glow);
}
.graph-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:var(--metal-border);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.graph-card::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  --cc:rgba(0,170,255,0.9);--cs:18px;
  background:
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) top left/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) top right/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top right/1px var(--cs) no-repeat,
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) bottom left/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) bottom right/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom right/1px var(--cs) no-repeat;
}
.graph-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.graph-title{font-size:8px;color:rgba(0,170,255,0.4);letter-spacing:2px;}
.graph-legend{display:flex;gap:12px;align-items:center;}
.graph-legend span{font-size:9px;font-family:'Space Mono',monospace;font-weight:600;letter-spacing:0.5px;}
.graph-canvas-wrap{flex:1;position:relative;min-height:160px;}
.graph-canvas-wrap canvas{display:block;width:100%;height:100%;min-height:160px;}
.funnel-card{
  background:rgba(6,14,22,0.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:none;border-radius:10px;padding:14px;
  position:relative;overflow:hidden;
  box-shadow:var(--glow);
}
.funnel-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:var(--metal-border);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.funnel-card::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  --cc:rgba(0,212,255,0.9);--cs:18px;
  background:
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) top left/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) top right/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top right/1px var(--cs) no-repeat,
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) bottom left/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) bottom right/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom right/1px var(--cs) no-repeat;
}
.funnel-title{font-size:8px;color:rgba(0,170,255,0.4);letter-spacing:2px;margin-bottom:12px;}
.funnel-row{margin-bottom:7px;}
.funnel-row-head{display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px;}
.funnel-row-lbl{color:#E0E0E0 !important;font-weight:600;text-shadow:none !important;}
.funnel-row-pct{font-weight:700;color:#00F2FF !important;text-shadow:none !important;}
.funnel-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.funnel-bar-fill{height:100%;border-radius:2px;}
.funnel-ents{padding-top:8px;border-top:1px solid var(--border);margin-top:6px;}
.funnel-ent-row{display:flex;justify-content:space-between;font-size:9px;margin-bottom:3px;}

/* ENT CARDS */
.ents-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.dash-ent-card{
  background:rgba(6,14,22,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:none;border-radius:10px;padding:12px;
  position:relative;overflow:hidden;
  box-shadow:0 0 16px rgba(var(--cr),0.22),0 0 45px rgba(var(--cr),0.09);
  transition:box-shadow 0.35s;
}
.dash-ent-card:hover{box-shadow:0 0 30px rgba(var(--cr),0.5),0 0 70px rgba(var(--cr),0.22);}
.dash-ent-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,rgba(var(--cr),0.65) 0%,rgba(var(--cr),0.15) 40%,rgba(var(--cr),0.05) 65%,rgba(var(--cr),0.55) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.dash-ent-card::after{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:0.9;
  --cc:var(--c);--cs:16px;
  background:
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) top left/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) top right/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top right/1px var(--cs) no-repeat,
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) bottom left/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) bottom right/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom right/1px var(--cs) no-repeat;
}
.dash-ent-name{font-family:'Bebas Neue',sans-serif;color:var(--c);font-size:0.9rem;letter-spacing:2px;margin-bottom:8px;padding-left:10px;}
.dash-ent-body{padding-left:10px;}
.dash-ent-row{display:flex;justify-content:space-between;font-size:10px;padding:3px 0;border-bottom:1px solid var(--border);}
.dash-ent-row:last-child{border-bottom:none;}
.dash-ent-lbl{color:rgba(0,170,255,0.4);}
.dash-ent-val{color:var(--text);}
.dash-ent-call{color:var(--c);font-weight:700;}
.dash-ent-bar{height:2px;background:var(--border);border-radius:1px;margin-top:6px;overflow:hidden;}
.dash-ent-bar-fill{height:100%;border-radius:1px;}
.dash-ent-conv{font-size:8px;color:rgba(var(--cr),0.5);text-align:right;margin-top:2px;}

/* BOTTOM ROW */
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rev-card-dash{
  background:rgba(4,14,10,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:none;border-radius:10px;padding:14px;
  position:relative;overflow:hidden;
  box-shadow:0 0 16px rgba(52,211,153,0.22),0 0 45px rgba(52,211,153,0.09);
}
.rev-card-dash::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,rgba(52,211,153,0.65) 0%,rgba(20,100,60,0.15) 40%,rgba(10,60,35,0.05) 65%,rgba(52,211,153,0.5) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.rev-card-dash::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  --cc:rgba(52,211,153,0.9);--cs:18px;
  background:
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) top left/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) top right/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top right/1px var(--cs) no-repeat,
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) bottom left/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) bottom right/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom right/1px var(--cs) no-repeat;
}
.rev-title{font-size:8px;color:rgba(52,211,153,0.7);letter-spacing:2px;margin-bottom:10px;}
.rev-ent-row::before{content:'◈ ';color:rgba(52,211,153,0.5);font-size:9px;}
.rev-ent-row{display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px;}
.obj-card-dash{background:rgba(6,14,22,0.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;border-radius:10px;padding:14px;position:relative;overflow:hidden;box-shadow:var(--glow);}
.obj-card-dash::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:var(--metal-border);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.obj-card-dash::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  --cc:rgba(0,170,255,0.72);--cs:18px;
  background:
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) top left/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) top right/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top right/1px var(--cs) no-repeat,
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) bottom left/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) bottom right/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom right/1px var(--cs) no-repeat;
}
.obj-title{font-size:8px;color:rgba(0,170,255,0.4);letter-spacing:2px;margin-bottom:10px;}
.obj-row{margin-bottom:8px;}
.obj-row-head{display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px;}
.obj-bar{height:2px;background:var(--border);border-radius:1px;overflow:hidden;}
.obj-bar-fill{height:100%;border-radius:1px;}

/* ===== JOURNALIER ===== */
.jour-page{padding:20px;}
.jh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.jh-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:4px;}
.jh-right{display:flex;align-items:center;gap:14px;}
.jh-total{font-size:13px;color:var(--muted2);}
.jh-total span{color:var(--cyan);font-family:'Space Mono',monospace;font-size:1.1rem;font-weight:700;}
.jh-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--cyan);padding:9px 16px;border-radius:8px;cursor:pointer;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;transition:all 0.2s;}
.jh-btn:hover{border-color:var(--cyan);}

/* CALENDAR */
.cal-wrap{
  background:rgba(6,14,22,0.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:none;border-radius:12px;padding:18px;
  margin-bottom:18px;position:relative;overflow:hidden;
  box-shadow:var(--glow);
}
.cal-wrap::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:var(--metal-border);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.cal-wrap::after{content:none;}
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cal-label{display:none;}
.cal-nav{display:flex;gap:8px;}
.cal-nav-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--muted2);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.cal-nav-btn:hover{border-color:var(--cyan);color:var(--cyan);}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;}
.cal-dh{text-align:center;font-size:9px;font-family:'Orbitron',monospace;letter-spacing:1.5px;color:rgba(0,212,255,0.35);padding:6px 0;border-bottom:1px solid rgba(0,212,255,0.08);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{min-height:44px;border-radius:8px;cursor:pointer;border:1px solid transparent;color:var(--muted);transition:all 0.15s;background:rgba(255,255,255,0.01);display:flex;flex-direction:column;align-items:center;padding:6px 4px;gap:3px;}
.cal-cell:hover{background:rgba(0,170,255,0.05);border-color:rgba(0,170,255,0.15);}
.cal-cell.worked{color:var(--text);background:rgba(0,170,255,0.04);border-color:rgba(0,170,255,0.08);}
.cal-cell.today{background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.4);color:var(--cyan);box-shadow:0 0 8px rgba(0,212,255,0.14) inset;}
.cal-cell.selected:not(.today){border-color:rgba(0,170,255,0.4);background:rgba(0,170,255,0.06);}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none;}
.cal-cell-num{font-size:12px;font-weight:400;line-height:1;}
.cal-cell.today .cal-cell-num{font-weight:700;}
.cal-cell-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;}
.cal-dot{width:5px;height:5px;border-radius:50%;}
.cal-cell-total{font-size:10px;color:var(--muted2);margin-top:auto;}
.cal-cell.worked .cal-cell-total{color:var(--cyan2);opacity:0.75;}

/* 4 ENT METRIC CARDS */
.ent-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.ent-card{
  background:rgba(8,15,26,0.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:12px;overflow:hidden;
  border:none;border-top:2px solid var(--c);
  position:relative;
  box-shadow:0 0 18px rgba(var(--cr),0.22),0 0 50px rgba(var(--cr),0.09);
  transition:box-shadow 0.35s;
}
.ent-card:hover{box-shadow:0 0 32px rgba(var(--cr),0.5),0 0 75px rgba(var(--cr),0.22);}
.ent-card::after{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:0.9;
  --cc:var(--c);--cs:16px;
  background:
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) top right/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top right/1px var(--cs) no-repeat,
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) bottom left/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) bottom right/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom right/1px var(--cs) no-repeat;
}
.ent-card-head{padding:16px 20px 12px;background:linear-gradient(180deg,rgba(var(--cr),0.05),transparent);}
.ent-card-head-inner{display:flex;justify-content:space-between;align-items:center;}
.ent-card-name{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:3px;color:var(--c);}
.ent-card-total{font-size:11px;color:var(--c);background:var(--surface2);border:1px solid rgba(var(--cr),0.2);padding:4px 10px;border-radius:4px;}
.ent-card-body{padding:4px 20px 18px;}

/* METRIC ROWS — parfaitement droites */
.mrow{display:flex;align-items:center;height:56px;border-bottom:1px solid var(--border);white-space:nowrap;}
.mrow:last-child{border-bottom:none;}
.mrow.sep{border-top:1px solid rgba(var(--cr),0.2);margin-top:6px;border-bottom:none;}
.mlbl{flex:1;font-size:13px;color:var(--muted2);white-space:nowrap;overflow:hidden;}
.mlbl.call{color:var(--c);font-weight:700;}
/* Call value glow */

/* PREMIUM BUTTONS */
.mbtn-wrap{display:flex;align-items:center;gap:0;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;overflow:hidden;flex-shrink:0;margin-left:12px;}
.mminus{width:38px;height:38px;border:none;background:transparent;color:var(--muted2);cursor:pointer;font-size:20px;font-weight:300;display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:all 0.15s;padding:0;line-height:1;border-right:1px solid var(--border2);}
.mminus:hover{background:rgba(255,255,255,0.05);color:var(--text);}
.mminus:active{transform:scale(0.9);}
.mval-input{width:46px;text-align:center;background:transparent;border:none;color:var(--text);font-family:'Space Mono',monospace;font-size:15px;outline:none;padding:0;cursor:text;}
.mval-input.call-val{color:var(--c);}
.mval-input::-webkit-inner-spin-button,.mval-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.mplus{width:38px;height:38px;border:none;background:var(--c);color:#000;cursor:pointer;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:all 0.15s;padding:0;line-height:1;border-left:1px solid var(--border2);}
.mplus:hover{opacity:0.85;}
.mplus:active{transform:scale(0.9);}

/* TOTAL CALLS */
.tcrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;border-top:1px solid rgba(var(--cr),0.25);margin-top:6px;}
.tclbl{font-size:14px;color:var(--cyan);font-weight:700;}
.tcval{font-family:'Space Mono',monospace;font-size:1.2rem;font-weight:700;color:var(--cyan);}

/* DAILY TASKS JOUR */
.tasks-wrap{

.tasks-bg-grid{position:absolute;inset:0;opacity:0.025;pointer-events:none;background-image:linear-gradient(#00d4ff 1px,transparent 1px),linear-gradient(90deg,#00d4ff 1px,transparent 1px);background-size:22px 22px;}
.tasks-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative;}
.tasks-sub{font-size:9px;color:rgba(0,212,255,0.3);letter-spacing:3px;margin-bottom:3px;}
.tasks-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:3px;}
.tasks-title span{color:var(--cyan);}
.tasks-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative;}
.task-item{display:flex;align-items:center;gap:10px;background:#020706;border:1px solid #081208;border-radius:8px;padding:12px 12px 12px 15px;cursor:pointer;user-select:none;position:relative;overflow:hidden;transition:border-color 0.15s;}
.task-item:hover{border-color:rgba(0,212,255,0.1);}
.task-item.done{background:#010503;border-color:#060e07;}
.task-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
.task-cb{width:16px;height:16px;border-radius:4px;border:1px solid #0a2010;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.task-cb.checked{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 6px rgba(0,212,255,0.55),0 0 14px rgba(0,212,255,0.2);}
.task-lbl{flex:1;font-size:13px;color:#c8e8f0;transition:all 0.2s;}
.task-item.done .task-lbl{text-decoration:line-through;text-decoration-color:rgba(0,212,255,0.2);color:#1a3a44;}
.task-badge{font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid;flex-shrink:0;font-weight:700;}
.task-item.done .task-badge{opacity:0.2;}
.tasks-footer{margin-top:12px;padding-top:8px;border-top:1px solid rgba(0,212,255,0.06);display:flex;justify-content:space-between;position:relative;}
.tasks-reset{font-size:9px;color:rgba(0,212,255,0.15);}
.tasks-status{font-size:9px;color:rgba(0,212,255,0.35);}
.scan-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.15),transparent);pointer-events:none;}

/* LEADS */
.leads-page{padding:20px;}
.leads-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
.ladd-btn{color:#d8d8d8;border:1px solid #3c3c3c;border-radius:8px;padding:9px 14px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;background:linear-gradient(180deg,#2c2c2c 0%,#1c1c1c 55%,#111 100%);text-shadow:0 1px 3px rgba(0,0,0,0.9);letter-spacing:1px;}
.ladd-btn:hover{opacity:0.9;filter:brightness(1.15);}
.leads-table{width:100%;border-collapse:collapse;font-size:13px;}
.leads-table th{text-align:left;padding:10px;border-bottom:1px solid #1a1a1a;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#E0E0E0 !important;font-family:'Orbitron',sans-serif;font-weight:600;text-shadow:none !important;}
.leads-table td{padding:10px;border-bottom:1px solid #1a1a1a;vertical-align:middle;}
.leads-table tr:hover td{background:none;}
.linput{background:transparent;border:none;color:var(--text);font-family:'Space Mono',monospace;font-size:13px;outline:none;width:100%;min-width:80px;}
.linput:focus{background:var(--surface);border-radius:4px;padding:2px 4px;}
.lcash{font-family:'Space Mono',monospace;font-size:12px;width:70px;background:transparent;border:none;color:var(--text);outline:none;}
.lcash:focus{background:var(--surface);border-radius:4px;padding:2px 4px;}
.lcomm{color:var(--cyan);font-family:'Space Mono',monospace;font-size:12px;text-shadow:0 0 6px rgba(0,212,255,0.4);}
.ltag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;background:var(--surface);border:1px solid var(--border2);color:var(--muted2);margin:1px;font-family:'Space Mono',monospace;letter-spacing:0.5px;}
.ltag-x{cursor:pointer;color:var(--muted2);transition:color 0.2s;}
.ltag-x:hover{color:#f43f5e;}
.ldel{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:6px;transition:color 0.2s;}
.ldel:hover{color:#f43f5e;}
.leads-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;}
.lsum-card{
  background:rgba(8,15,26,0.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);

}

  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}

  content:'';position:absolute;inset:0;pointer-events:none;opacity:0.9;

    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom right/1px var(--cs) no-repeat;

.lsum-name{font-size:10px;color:var(--c);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
.lsum-val{font-family:'Space Mono',monospace;font-size:1.4rem;font-weight:700;color:#ffffff;}
.lsum-comm{font-size:10px;color:var(--cyan);margin-top:2px;}

    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top right/1px var(--cs) no-repeat,
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) bottom left/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) bottom right/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom right/1px var(--cs) no-repeat;
}
.padd:hover{color:var(--cyan);box-shadow:0 0 22px rgba(0,212,255,0.32),0 0 50px rgba(0,212,255,0.14);}
.task-config{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:20px;}
.task-config-title{font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
.task-config-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.task-config-item{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:8px;padding:10px 14px;border:1px solid var(--border);}
.task-config-lbl{flex:1;font-size:13px;}
.task-config-badge{font-size:10px;color:var(--muted2);background:var(--border2);padding:2px 8px;border-radius:4px;font-family:'Space Mono',monospace;}
.task-config-del{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;transition:color 0.2s;padding:4px;}
.task-config-del:hover{color:#f43f5e;}
.task-add-row{display:flex;gap:8px;}
.task-add-input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;color:var(--text);font-family:'Space Mono',monospace;font-size:13px;outline:none;transition:border-color 0.2s;}
.task-add-input:focus{border-color:var(--cyan);}
.task-add-btn{background:var(--cyan);color:#000;border:none;border-radius:8px;padding:8px 16px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;transition:opacity 0.2s,box-shadow 0.2s;}
.task-add-btn:hover{opacity:0.85;box-shadow:0 0 10px rgba(0,212,255,0.28);}

.stitle{font-size:10px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}

/* ===== FUNNEL FILTERS ===== */
.funnel-filters{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;}
.funnel-filters::-webkit-scrollbar{display:none;}
.funnel-filter-btn{background:transparent;border:1px solid var(--border2);color:var(--muted2);border-radius:6px;padding:3px 9px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.5px;cursor:pointer;white-space:nowrap;transition:all 0.15s;flex-shrink:0;}
.funnel-filter-btn:hover{border-color:var(--cyan);color:var(--cyan);}
.funnel-filter-btn.active{font-weight:700;}

/* ===== ACCORDÉONS PARAMS ===== */
.acc-wrap{margin-bottom:8px;}
.acc-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;padding:14px 16px;border-radius:10px;background:rgba(8,15,26,0.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;transition:box-shadow 0.2s;position:relative;box-shadow:0 0 12px rgba(0,212,255,0.12),0 0 32px rgba(0,212,255,0.05);}
.acc-header::after{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  --cc:rgba(0,212,255,0.5);--cs:14px;
  background:
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) top left/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) top right/var(--cs) 1px no-repeat,
    linear-gradient(to bottom,var(--cc) var(--cs),transparent var(--cs)) top right/1px var(--cs) no-repeat,
    linear-gradient(to right,var(--cc) var(--cs),transparent var(--cs)) bottom left/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom left/1px var(--cs) no-repeat,
    linear-gradient(to left,var(--cc) var(--cs),transparent var(--cs)) bottom right/var(--cs) 1px no-repeat,
    linear-gradient(to top,var(--cc) var(--cs),transparent var(--cs)) bottom right/1px var(--cs) no-repeat;
}
.acc-header:hover{box-shadow:0 0 18px rgba(0,212,255,0.22),0 0 42px rgba(0,212,255,0.09);}
.acc-header.open{border-radius:10px 10px 0 0;box-shadow:0 0 20px rgba(0,212,255,0.28),0 0 48px rgba(0,212,255,0.12);}
.acc-chevron{font-size:10px;color:var(--muted2);transition:transform 0.25s;flex-shrink:0;}
.acc-header.open .acc-chevron{transform:rotate(180deg);}
.acc-body{background:var(--surface);border:1px solid rgba(0,212,255,0.12);border-top:none;border-radius:0 0 10px 10px;padding:16px;display:none;}
.acc-body.open{display:block;}

/* ===== RESPONSIVE MOBILE ===== */
@media (max-width: 768px) {

  /* --- Tab bar --- */
  .tab { padding: 10px 0; gap: 3px; }
  .tab .ticon { width: 20px; height: 20px; }
  .tab .tlbl { font-size: 8px; letter-spacing: 1px; }
  .live-lbl { display: none; }
  #authChip { display: none !important; }

  /* --- Pages padding --- */
  .dash-page, .jour-page, .leads-page, .params-page { padding: 12px; }

  /* --- Dashboard header --- */
  .dash-header { margin-bottom: 14px; }
  .dash-title { font-size: 1.2rem; }
  .dash-sub { display: none; }
  .dash-clock { display: none; }

  /* === KPI row : 2 colonnes, ring card pleine largeur === */
  .kpi-row {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .kpi-tasks-card {
    grid-column: 1 / -1;
  }
  .kpi-val { font-size: 1.4rem; }
  .kpi-label { font-size: 8px; }

  /* === Podium : cadres réduits pour tenir dans la moitié de largeur === */
  .pm-slots { gap: 2px !important; }
  .pm-p1 { width: 56px !important; height: 68px !important; }
  .pm-p2 { width: 44px !important; height: 54px !important; }
  .pm-p3 { width: 44px !important; height: 44px !important; }
  .pm-name { font-size: 6px !important; }
  .pm-val { font-size: 10px !important; }
  .pm-p2 .pm-val, .pm-p3 .pm-val { font-size: 8px !important; }

  /* === Habitudes / Daily Tasks : titres empilés au lieu de superposés === */
  .kpi-merged .dtasks-lbl {
    position: static !important;
    width: auto !important;
    text-align: left !important;
    margin: 2px 0 6px !important;
  }

  /* === Sections repliables (mobile uniquement) === */
  .mobile-fold-summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(0, 212, 255, 0.75);
    padding: 12px 2px;
    border-bottom: 1px solid rgba(0, 212, 255, 0.15);
    margin-bottom: 10px;
  }
  .mobile-fold-summary::-webkit-details-marker { display: none; }
  .mobile-fold-summary::before {
    content: '▸';
    font-size: 9px;
    transition: transform 0.2s;
  }
  .mobile-fold[open] > .mobile-fold-summary::before { transform: rotate(90deg); }

  /* === Mid row : 1 colonne empilée === */
  .mid-row {
    display: flex !important;
    flex-direction: column !important;
    gap: 8px;
    width: 100%;
  }
  .mid-row > * {
    width: 100% !important;
    box-sizing: border-box;
  }

  /* === Graph card === */
  .graph-card {
    height: auto !important;
    min-height: unset;
    display: flex;
    flex-direction: column;
  }
  /* Header du graph : empiler titre et légende verticalement */
  .graph-head {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 6px;
  }
  .graph-legend {
    flex-wrap: wrap !important;
  }
  /* Canvas wrapper : hauteur fixe explicite */
  .graph-canvas-wrap {
    height: 200px !important;
    min-height: 200px !important;
    flex: none !important;
    width: 100% !important;
    display: block !important;
    position: relative !important;
  }
  #convChart {
    display: block !important;
    width: 100% !important;
    height: 200px !important;
    position: relative !important;
  }

  /* === Funnel card : hauteur auto selon contenu === */
  .funnel-card {
    height: auto !important;
    overflow: visible !important;
  }

  /* === Ent cards Dashboard : 1 colonne === */
  .ents-row {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  /* === Bottom row : 1 colonne === */
  .bottom-row {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  /* --- Revenue inline grids (override) --- */
  .rev-card-dash [style*="grid-template-columns:repeat(4"],
  .rev-card-dash [style*="grid-template-columns: repeat(4"] {
    grid-template-columns: repeat(2, 1fr) !important;
  }

  /* --- JOUR header --- */
  .jh { flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
  .jh-title { font-size: 1.4rem; }
  .jh-right { width: 100%; justify-content: space-between; }

  /* === Calendar : réduire cellules === */
  .cal-wrap { padding: 12px; }
  .cal-cell { min-height: 36px; padding: 4px 2px; }
  .cal-cell-num { font-size: 11px; }
  .cal-cell-total { display: none; }
  .cal-dh { font-size: 10px; }

  /* === Ent metric cards : 1 colonne === */
  .ent-grid {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  /* Boutons +/- : zone tactile confortable au pouce */
  .mminus, .mplus { width: 44px; height: 44px; font-size: 22px; }
  .mval-input { width: 52px; font-size: 16px; }
  .mlbl { font-size: 12px; }
  .mrow { height: 52px; }

  /* === Tasks list : 1 colonne === */
  .tasks-list { grid-template-columns: 1fr; }
  .tasks-wrap { padding: 14px; }
  .task-lbl { font-size: 12px; }

  /* === LEADS === */
  .leads-table { font-size: 12px; }
  .leads-table th { font-size: 9px; padding: 8px 6px; }
  .leads-table td { padding: 8px 6px; }

  /* Summary leads + revenus manuels : 2 colonnes */
  .leads-sum {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  #revManuelsGrid {
    grid-template-columns: repeat(2, 1fr) !important;
  }

  /* === PARAMS : 1 colonne === */
  .params-grid {
    grid-template-columns: 1fr;
    gap: 10px;
  }
}

/* === Sections repliables : toujours ouvertes sur PC, aucun changement visuel === */
@media(min-width:769px){
  .mobile-fold-summary{display:none !important;}
  .mobile-fold .fold-body{display:block !important;}
}

@media (max-width: 480px) {

  /* Tab bar encore plus compact */
  .tab { padding: 8px 0; gap: 2px; }
  .tab .ticon { width: 18px; height: 18px; }
  .tab .tlbl { font-size: 7px; }

  /* Pages */
  .dash-page, .jour-page, .leads-page, .params-page { padding: 8px; }

  /* KPI cards */
  .kpi-card { padding: 10px; }
  .kpi-val { font-size: 1.2rem; }
  .kpi-spark { display: none; }

  /* Ent cards Dash : toujours 1 colonne */
  .ents-row { grid-template-columns: 1fr; }

  /* Funnel masqué sur très petit écran */
  .funnel-card { display: none; }

  /* Calendar encore plus compact */
  .cal-cell { min-height: 30px; padding: 3px 1px; }
  .cal-cell-num { font-size: 10px; }
  .cal-dot { width: 4px; height: 4px; }
  .cal-dh { font-size: 9px; padding: 4px 0; }

  /* Boutons +/- : taille pouce optimale Apple (44pt) */
  .mminus, .mplus { width: 48px; height: 48px; }

  /* Tasks */
  .task-lbl { font-size: 11px; }
  .task-badge { font-size: 9px; padding: 2px 5px; }

  /* Leads */
  .leads-table { font-size: 11px; }
  .leads-sum { grid-template-columns: 1fr; }
  #revManuelsGrid { grid-template-columns: 1fr !important; }

  /* Auth card */
  .auth-card { padding: 32px 20px; }
  .auth-logo { font-size: 1.5rem; }
  .auth-btn { font-size: 11px; padding: 12px 18px; }
}

/* ===== AUTH ===== */
#authScreen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;}
#authScreen.hidden{display:none;}
.auth-card{background:#0a0f16;border:1px solid rgba(0,170,255,0.18);border-radius:16px;padding:48px 40px;text-align:center;max-width:340px;width:90%;}
.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:6px;margin-bottom:6px;}
.auth-logo .s{background:linear-gradient(180deg,#e8f4ff,#a0b8cc,#6080a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.auth-logo .t{color:var(--cyan);text-shadow:0 0 10px rgba(0,212,255,0.5);}
.auth-sub{font-size:9px;color:rgba(0,170,255,0.35);letter-spacing:3px;margin-bottom:36px;}
.auth-btn{display:inline-flex;align-items:center;gap:10px;background:var(--cyan);color:#000;border:none;border-radius:10px;padding:13px 24px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:opacity 0.2s;}
.auth-btn:hover{opacity:0.88;}
.auth-denied{margin-top:18px;font-size:11px;color:#f43f5e;letter-spacing:1px;display:none;}
#authChip{display:none;align-items:center;gap:8px;padding:0 12px;border-left:1px solid var(--border2);font-size:9px;color:var(--muted2);letter-spacing:1px;white-space:nowrap;}
#authChip.visible{display:flex;}
#logoutBtn{background:transparent;border:1px solid rgba(0,242,255,0.2);color:var(--muted2);border-radius:5px;padding:3px 8px;font-family:'Space Mono',monospace;font-size:8px;cursor:pointer;transition:all 0.2s;letter-spacing:1px;}
#logoutBtn:hover{border-color:var(--cyan);color:var(--cyan);}

/* ========================================================
   VIVID GLASS OVERRIDE
   ======================================================== */

/* --- Cards : verre dépoli + bordure laser --- */
.kpi-card,.kpi-ring-card,.graph-card,.funnel-card,
.dash-ent-card,.rev-card-dash,.obj-card-dash,
.cal-wrap,.kpi-tasks-card,.tasks-wrap,
.lsum-card,.params-card,.padd,.acc-header {
  background:rgba(15,23,42,0.62);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  border:1px solid rgba(0,242,255,0.15);
  border-radius:16px;
  box-shadow:0 12px 32px rgba(0,0,0,0.6);
}
/* hover : lueur laser sur la bordure */
.kpi-card:hover,.graph-card:hover,.funnel-card:hover,
.dash-ent-card:hover,.rev-card-dash:hover,.lsum-card:hover,
.params-card:hover,.kpi-tasks-card:hover,.tasks-wrap:hover {
  border-color:rgba(0,242,255,0.35);
  box-shadow:0 12px 40px rgba(0,0,0,0.65),0 0 22px rgba(0,242,255,0.14);
}
/* Ent cards JOUR : conserver la bordure top colorée */
.ent-card{
  background:rgba(15,23,42,0.62);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  border:1px solid rgba(0,242,255,0.12);
  border-top:2px solid var(--c);
  border-radius:16px;
  box-shadow:0 12px 32px rgba(0,0,0,0.6);
}
/* Params cards : conserver la border-top colorée */
.params-card{border-top:2px solid var(--c,var(--cyan));}
/* Acc body verre */
.acc-body{
  background:rgba(10,18,34,0.7);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  border:1px solid rgba(0,242,255,0.1);border-top:none;
  border-radius:0 0 16px 16px;
}

/* --- Laser line au sommet de chaque carte (remplace ::before métal) --- */
.kpi-card::before,.kpi-ring-card::before,.graph-card::before,
.funnel-card::before,.dash-ent-card::before,.rev-card-dash::before,
.obj-card-dash::before,.cal-wrap::before,.kpi-tasks-card::before,
.tasks-wrap::before,.lsum-card::before {
  content:'';
  position:absolute;
  inset:unset;
  top:0;left:10%;right:10%;
  height:1px;
  padding:0;
  background:var(--laser);
  -webkit-mask:none;mask:none;
  border-radius:0;
  z-index:1;pointer-events:none;
}
/* Dash ent card : laser au lieu de la barre gauche */
.dash-ent-card::before{left:5%;right:5%;}
/* padd : laser via ::before déjà présent */
.padd::before{background:var(--laser);-webkit-mask:none;mask:none;padding:0;inset:unset;top:0;left:10%;right:10%;height:1px;border-radius:0;}

/* --- Boutons globaux (hors mplus coloré entrepreneur) --- */
button:not(.mplus):not(.mminus):not(.auth-btn):not(.psave):not(.ladd-btn) {
  background:rgba(0,242,255,0.05);
  border:1px solid rgba(0,242,255,0.28);
  color:#00f2ff;
  font-family:'Space Mono',monospace;
  text-transform:uppercase;
  letter-spacing:1px;
  transition:all 0.25s ease;
  cursor:pointer;
  border-radius:8px;
}
button:not(.mplus):not(.mminus):not(.auth-btn):not(.psave):not(.ladd-btn):hover {
  background:#00f2ff;
  color:#000;
  box-shadow:0 0 20px rgba(0,242,255,0.55);
}

/* --- Titres néon --- */
.dash-title .t,.jh-title,.auth-logo .t {
  color:#00f2ff;
  text-shadow:0 0 18px rgba(0,242,255,0.55);
}
.kpi-label,.graph-title,.funnel-title,.obj-title,.rev-title,
.tasks-sub,.stitle,.kpi-tasks-lbl {
  color:rgba(0,242,255,0.55);
  letter-spacing:2px;
}

/* --- Inputs verre --- */
.pinput,.linput,.lcash,.task-add-input,.mval-input {
  background:rgba(0,242,255,0.03);
  border:1px solid rgba(0,242,255,0.18);
  color:var(--text);
  border-radius:8px;
}
.pinput:focus,.task-add-input:focus {
  border-color:rgba(0,242,255,0.5);
  box-shadow:0 0 12px rgba(0,242,255,0.18);
  outline:none;
}

/* --- Tab bar glass --- */
.tabs {
  background:rgba(5,7,10,0.8);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,242,255,0.12);
}

/* --- Auth card glass --- */
.auth-card {
  background:rgba(10,17,30,0.82);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(0,242,255,0.2);
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.7),0 0 0 1px rgba(0,242,255,0.08);
}

/* --- Token tech (icônes filaires HUD) --- */
.token-tech{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:20px;margin-right:5px;flex-shrink:0;vertical-align:middle;
}

/* Typographie revenus renforcée */
.lsum-val{font-family:'Orbitron','Bebas Neue',sans-serif !important;font-size:1.9rem !important;font-weight:900 !important;letter-spacing:4px;}
.lsum-comm{font-size:11px !important;color:var(--cyan);margin-top:4px;font-weight:700;}
.lsum-name{font-size:11px !important;letter-spacing:1.5px;}

/* z-index : tabs + pages au dessus */
.tabs,.page{position:relative;z-index:1;}

/* ===== NEUMORPHIC COUNTER BUTTONS ===== */
.mbtn-wrap{
  display:flex;align-items:center;gap:5px;
  background:transparent !important;
  border:none !important;
  border-radius:0 !important;
  overflow:visible !important;
  flex-shrink:0;margin-left:8px;
}
.mminus,.mplus{
  width:28px !important;height:28px !important;
  background:#060a12 !important;
  border:1px solid rgba(255,255,255,0.06) !important;
  border-radius:6px !important;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;
  transition:box-shadow 0.15s,transform 0.1s !important;
  padding:0;font-size:0 !important;
  position:relative;overflow:visible;
  box-shadow:inset 2px 2px 5px rgba(0,0,0,0.6),inset -1px -1px 3px rgba(255,255,255,0.04) !important;
  /* Annuler les styles du bloc global bouton */
  color:transparent !important;
  text-transform:none !important;
  letter-spacing:0 !important;
}
.mminus:hover,.mplus:hover{
  background:#060a12 !important;
  color:transparent !important;
  box-shadow:inset 1px 1px 3px rgba(0,0,0,0.45),inset -1px -1px 3px rgba(255,255,255,0.07),0 0 8px rgba(var(--cr,0,242,255),0.2) !important;
}
.mminus:active,.mplus:active{
  box-shadow:inset -2px -2px 5px rgba(0,0,0,0.65),inset 2px 2px 4px rgba(255,255,255,0.09) !important;
  transform:scale(0.94) !important;
}
/* Barre horizontale − */
.mminus::before{
  content:'';display:block;
  width:10px;height:1.5px;
  background:rgba(var(--cr,0,242,255),0.6);
  border-radius:1px;
}
/* Croix + : barre H */
.mplus::before{
  content:'';position:absolute;
  width:10px;height:1.5px;
  background:var(--c,var(--cyan));
  border-radius:1px;
  box-shadow:0 0 6px var(--c,var(--cyan));
}
/* Croix + : barre V */
.mplus::after{
  content:'';position:absolute;
  width:1.5px;height:10px;
  background:var(--c,var(--cyan));
  border-radius:1px;
  box-shadow:0 0 6px var(--c,var(--cyan));
}
/* Input valeur compact */
.mval-input{
  width:36px !important;font-size:14px;
  background:transparent !important;
  border:none !important;

/* ============================================
   ULTRA 3D ANIMATIONS — LAYER FINAL
   ============================================ */

/* Background particle canvas */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* Page entrance 3D */
@keyframes page-3d-enter{
  0%{opacity:0;transform:perspective(1000px) rotateX(6deg) translateY(22px) scale(0.97);}
  100%{opacity:1;transform:perspective(1000px) rotateX(0deg) translateY(0) scale(1);}
}
.page.active{animation:page-3d-enter 0.5s cubic-bezier(0.16,1,0.3,1) both;}

/* Card stagger entrance 3D */
@keyframes card-3d-up{
  0%{opacity:0;transform:perspective(900px) rotateX(16deg) translateY(32px) scale(0.95);}
  100%{opacity:1;transform:perspective(900px) rotateX(0deg) translateY(0) scale(1);}
}
.kpi-row>*,.mid-row>*,.ents-row>*,.bottom-row>*{animation:card-3d-up 0.58s cubic-bezier(0.16,1,0.3,1) both;}
.kpi-row>*:nth-child(1){animation-delay:0.04s}.kpi-row>*:nth-child(2){animation-delay:0.09s}
.kpi-row>*:nth-child(3){animation-delay:0.14s}.kpi-row>*:nth-child(4){animation-delay:0.19s}
.kpi-row>*:nth-child(5){animation-delay:0.24s}
.mid-row>*:nth-child(1){animation-delay:0.09s}.mid-row>*:nth-child(2){animation-delay:0.18s}
.ents-row>*:nth-child(1){animation-delay:0.06s}.ents-row>*:nth-child(2){animation-delay:0.12s}
.ents-row>*:nth-child(3){animation-delay:0.18s}.ents-row>*:nth-child(4){animation-delay:0.24s}
.bottom-row>*:nth-child(1){animation-delay:0.09s}.bottom-row>*:nth-child(2){animation-delay:0.17s}
